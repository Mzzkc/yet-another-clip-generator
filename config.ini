# Instagram Caption Generator Configuration
# Edit these settings to customize behavior

[Model]
# Ollama model to use for video analysis
# Options: qwen2.5-vl:7b, qwen3-vl, smolvlm2-500m-video-instruct-mlx
model_name = qwen2.5-vl:7b

# Ollama host URL
ollama_host = http://localhost:11434

[Paths]
# Directory containing input videos
videos_directory = /home/claude/instagram-caption-generator/videos

# Output CSV file
output_csv = /home/claude/instagram-caption-generator/output/instagram_captions.csv

# Log directory
log_directory = /home/claude/instagram-caption-generator/logs

[Processing]
# Maximum retry attempts for LLM calls
max_retries = 3

# Timeout for video analysis (seconds)
analysis_timeout = 120

# Force reprocess all videos (ignore CSV state)
force_reprocess = false

[Caption Settings]
# Minimum virality score to include in output (0-100)
min_virality_score = 0

# Maximum hashtags per caption (Instagram 2026 recommendation: 3-5)
max_hashtags = 5

# Default category if classification fails
default_category = General

[ASMR Optimization]
# Prioritize ASMR-specific hashtags
asmr_mode = true

# Core ASMR hashtags (always include if asmr_mode=true)
asmr_core_tags = #asmr, #asmrsounds, #relaxing

# ASMR trending keywords
asmr_keywords = whisper, tapping, tingles, sleep, calm, soothing
