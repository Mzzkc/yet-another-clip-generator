# vce-hardening.yaml
#
# Pattern: Tier 5 Complex Investigation (7 stages, 13 sheets)
# Adapted: Code hardening with preprocessing enrichment, perspectival
#          investigation, synthesis, parallel execution, and adversarial review.
#
# Execution Flow:
#   Stage 1: Frame — what must work, success criteria (1 sheet)
#       |
#   Stage 2: Preprocess — gather ALL raw material (1 sheet)
#       |
#   Stage 3: Investigate — 3 independent lenses (3 sheets)
#       |
#   Stage 4: Synthesize — collide perspectives, produce fix plan (1 sheet)
#       |
#   Stage 5: Execute — 3 parallel workers implement fixes (3 sheets)
#       |
#   Stage 6: Adversarial Review — 3 parallel reviewers (3 sheets)
#       |
#   Stage 7: Final — incorporate review, full E2E verification (1 sheet)

name: "vce-hardening"
workspace: "/home/emzi/Projects/yacg"

backend:
  type: claude_cli
  skip_permissions: true
  disable_mcp: true
  timeout_seconds: 3600
  output_format: text
  timeout_overrides:
    2: 5400    # Preprocess: downloads video + pulls model
    7: 5400    # Execute worker 1: many code changes
    8: 5400    # Execute worker 2: writes tests + downloads
    9: 5400    # Execute worker 3: setup.sh + fixtures
    13: 7200   # Final: full E2E with real video processing

sheet:
  size: 1
  total_items: 7
  fan_out:
    3: 3   # 3 investigation lenses
    5: 3   # 3 execution workers
    6: 3   # 3 adversarial reviewers
  dependencies:
    2: [1]
    3: [2]
    4: [3]
    5: [4]
    6: [5]
    7: [6]

parallel:
  enabled: true
  max_concurrent: 3

cross_sheet:
  auto_capture_stdout: true
  max_output_chars: 8000
  lookback_sheets: 6
  capture_files:
    - "{{ workspace }}/score-artifacts/02-preprocessing.md"
    - "{{ workspace }}/score-artifacts/04-synthesis.md"

retry:
  max_retries: 2
  base_delay_seconds: 15
  max_completion_attempts: 3
  completion_threshold_percent: 100

rate_limit:
  wait_minutes: 60
  max_waits: 12

stale_detection:
  enabled: true
  idle_timeout_seconds: 2400

prompt:
  variables:
    rickroll_url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
    yt_transcriber: "/home/emzi/Projects/yt-transcriber"
    test_video_dir: "/tmp/vce_test_fixtures"

    lenses:
      1:
        name: "structural"
        voice: >-
          You are a software architect who thinks in module boundaries,
          data flow, and integration contracts. You see the forest.
        focus: "Architecture, pipeline data flow, module interfaces, integration points"
        question: "Does the code actually chain together correctly end-to-end?"
      2:
        name: "operational"
        voice: >-
          You are a user experience engineer who thinks in first-run
          experience, error messages, and observable behavior. You see
          what the user sees.
        focus: "Runtime behavior, CLI output, warnings, bootstrap, first-run experience"
        question: "Can someone clone this repo and use it immediately without confusion?"
      3:
        name: "quality"
        voice: >-
          You are a QA lead who thinks in test coverage, edge cases,
          and failure modes. You see what breaks.
        focus: "Test quality, coverage gaps, deprecated APIs, dependency health, adversarial inputs"
        question: "Are the tests testing real behavior, and what's not tested at all?"

    workers:
      1:
        name: "code-fixes"
        focus: "Fix all code bugs, bootstrap wiring, pipeline integration, clean output"
        report: "05-exec-code.md"
      2:
        name: "test-overhaul"
        focus: "Audit and fix unit tests, write integration tests, write adversarial tests"
        report: "05-exec-tests.md"
      3:
        name: "setup-polish"
        focus: "Create setup.sh, update dependencies, synthetic test fixtures, pytest config"
        report: "05-exec-setup.md"

    reviewers:
      1:
        name: "completeness"
        focus: "Did the fixes address everything in the synthesis? What was skipped?"
      2:
        name: "correctness"
        focus: "Do the fixes actually work? Run them. Test them. Verify claims."
      3:
        name: "robustness"
        focus: "Will this hold up? Edge cases, adversarial inputs, resource cleanup, race conditions."

  template: |
    {# ── Reusable macros ────────────────────────────────────── #}
    {% macro ctx() %}
    Working directory: {{ workspace }}
    Package: viral_clip_extractor/ (15+ Python modules)
    Tests: tests/ (root level, NOT inside the package)
    Reports: {{ workspace }}/score-artifacts/ (create if missing)
    Reference: {{ yt_transcriber }} (working bootstrap pattern to study)
    Test fixtures: {{ test_video_dir }} (shared across stages)
    {% endmacro %}

    {% macro output_spec(filename) %}
    ## Output
    - **File**: {{ workspace }}/score-artifacts/{{ filename }}
    - **Format**: Markdown with clear section headers
    - Write a complete, well-structured document
    {% endmacro %}

    {% macro quality_bar(level) %}
    {% if level == "high" %}
    Quality: Be thorough. Cite specific file paths and line numbers.
    No hedging. If uncertain, state what you'd need to verify.
    {% elif level == "draft" %}
    Quality: Prioritize coverage over polish. Mark uncertainties with [?].
    {% endif %}
    {% endmacro %}

    {% macro warn_rule() %}
    CRITICAL RULE: The user must NEVER see Python warnings at runtime.
    Fix root causes in our code. For third-party warnings (numpy/librosa
    internals), add targeted filterwarnings at application entry points
    with a comment explaining each filter. No blanket suppression.
    {% endmacro %}

    {# ── Stage logic ────────────────────────────────────────── #}
    {% if stage == 1 %}
    # Stage 1: Frame the Investigation

    {{ ctx() }}

    ## Context
    This codebase was AI-generated by a previous Mozart score. It has 15+
    Python modules, 134 passing tests, and 4000+ lines of code. The user
    says it's broken — the tests mock everything and no one has ever run
    the actual tool against real input. The code must work for a new user
    who clones from git.

    ## Your Task
    Frame this investigation precisely:

    1. **Restate the problem** — what exactly is broken or untested?
    2. **Map the territory** — list every module, CLI command, and option
    3. **Define success criteria** — what must be true when we're done:
       - Every CLI subcommand works: process, youtube, batch, check
       - Every option combination works (--no-captions, --no-semantic, --no-vertical = 8 combos)
       - `git clone && source setup.sh && python -m viral_clip_extractor check` works
       - 80% line coverage, 70% branch coverage
       - Zero runtime warnings visible to user
       - Rickroll ({{ rickroll_url }}) processes end-to-end
       - CSV output is correct and useful
    4. **Identify unknowns** — what do we not know yet?

    Three investigation lenses will analyze independently:
    {% for i in range(1, 4) %}
    - **{{ lenses[i].name | title }}**: {{ lenses[i].focus }}
    {% endfor %}

    {{ output_spec("01-framing.md") }}
    {{ quality_bar("draft") }}

    {% elif stage == 2 %}
    # Stage 2: Preprocessing

    {{ ctx() }}

    Read the framing at {{ workspace }}/score-artifacts/01-framing.md.

    ## Your Task
    Gather ALL raw material so downstream investigators can focus on
    analysis, not data collection. Do the tedious work here.

    ### 1. Pull the Ollama model (pipeline dependency)
    ```bash
    ollama pull qwen2.5vl:7b
    ```
    This may take several minutes. Start it first, then proceed.

    ### 2. Download test video fixtures
    ```bash
    mkdir -p {{ test_video_dir }}

    # Download full rickroll
    cd {{ workspace }} && python -c "
    from viral_clip_extractor.youtube_downloader import YouTubeDownloader
    dl = YouTubeDownloader(output_dir='{{ test_video_dir }}')
    result = dl.download('{{ rickroll_url }}')
    print(f'FULL: {result[\"video_path\"]}')
    "

    # Create 30-second clip
    FULL_VIDEO=$(ls {{ test_video_dir }}/*.mp4 | head -1)
    ffmpeg -y -i "$FULL_VIDEO" -t 30 -c copy {{ test_video_dir }}/rickroll_30s.mp4

    # Create synthetic fixtures
    ffmpeg -y -f lavfi -i color=c=black:s=320x240:d=1 \
      -f lavfi -i anullsrc=r=44100:cl=mono -t 1 \
      -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest \
      {{ test_video_dir }}/synthetic_1s.mp4

    ffmpeg -y -f lavfi -i color=c=blue:s=320x240:d=5 \
      -c:v libx264 -pix_fmt yuv420p -an \
      {{ test_video_dir }}/synthetic_noaudio.mp4

    ffmpeg -y -f lavfi -i color=c=red:s=320x240:d=0.04 \
      -c:v libx264 -pix_fmt yuv420p \
      {{ test_video_dir }}/synthetic_singleframe.mp4
    ```

    ### 3. Run every CLI command and capture output
    ```bash
    cd {{ workspace }}
    python -m viral_clip_extractor check 2>&1
    python -m viral_clip_extractor --help 2>&1
    python -m viral_clip_extractor process --help 2>&1
    python -m viral_clip_extractor youtube --help 2>&1
    python -m viral_clip_extractor batch --help 2>&1
    python -m viral_clip_extractor process --video /dev/null --title "test" 2>&1 || true
    python -m viral_clip_extractor process \
      --video {{ test_video_dir }}/rickroll_30s.mp4 \
      --title "Preprocess Test" \
      --output-dir /tmp/vce_preprocess_test \
      --no-semantic --top-n 2 --min-score 0 2>&1 || true
    ```

    ### 4. Import every module with warning capture
    ```bash
    cd {{ workspace }} && python -W all -c "
    import warnings, sys
    warnings.simplefilter('always')
    with warnings.catch_warnings(record=True) as w:
        warnings.simplefilter('always')
        import viral_clip_extractor.models
        import viral_clip_extractor.bootstrap
        import viral_clip_extractor.cli
        import viral_clip_extractor.pipeline
        import viral_clip_extractor.youtube_downloader
        import viral_clip_extractor.transcript_bridge
        import viral_clip_extractor.core.scene_detector
        import viral_clip_extractor.core.audio_analyzer
        import viral_clip_extractor.core.visual_analyzer
        import viral_clip_extractor.core.semantic_analyzer
        import viral_clip_extractor.core.virality_scorer
        import viral_clip_extractor.extractors.clip_extractor
        import viral_clip_extractor.extractors.smart_cropper
        import viral_clip_extractor.utils.config
        import viral_clip_extractor.utils.video_utils
    for warning in w:
        print(f'{warning.filename}:{warning.lineno}: {warning.category.__name__}: {warning.message}')
    if not w:
        print('No warnings detected')
    " 2>&1
    ```

    ### 5. Run existing test suite
    ```bash
    cd {{ workspace }} && python -m pytest tests/ -v --tb=short 2>&1
    ```

    ### 6. Check dependency versions
    ```bash
    pip list 2>/dev/null | grep -iE "numpy|opencv|librosa|scenedetect|requests|yt-dlp|faster-whisper"
    ```

    ### 7. Inventory all code
    ```bash
    cd {{ workspace }} && find viral_clip_extractor -name "*.py" -exec wc -l {} + | sort -n
    cd {{ workspace }} && grep -rn "def \|class " viral_clip_extractor/ --include="*.py" | wc -l
    ```

    ### 8. Check bootstrap wiring
    ```bash
    cd {{ workspace }}
    grep -n "ensure_ready\|bootstrap" viral_clip_extractor/__main__.py
    grep -n "ensure_ready\|bootstrap" viral_clip_extractor/cli.py
    ```

    ### 9. Verify ollama model ready
    ```bash
    ollama list | grep qwen2.5vl
    ```

    ### 10. Cleanup preprocess test output
    ```bash
    rm -rf /tmp/vce_preprocess_test
    ```

    ## Write the preprocessing report

    Record ALL outputs verbatim. Investigators need the raw data.

    {{ output_spec("02-preprocessing.md") }}
    {{ quality_bar("high") }}

    The report MUST have these sections:
    - **Test Video Fixtures** (paths to all created fixtures)
    - **CLI Command Outputs** (verbatim output of each command)
    - **Import Warnings** (every warning with file:line)
    - **Test Suite Results** (pass/fail counts, any failures)
    - **Dependency Versions** (installed versions)
    - **Code Inventory** (module sizes, function/class counts)
    - **Bootstrap Status** (is ensure_ready wired in?)
    - **Ollama Status** (model available?)

    {% elif stage == 3 %}
    # {{ lenses[instance].name | title }} Investigation

    {{ ctx() }}

    {{ lenses[instance].voice }}

    Read the framing at {{ workspace }}/score-artifacts/01-framing.md and
    the preprocessed data at {{ workspace }}/score-artifacts/02-preprocessing.md.

    ## Your Question
    {{ lenses[instance].question }}

    ## Your Focus
    {{ lenses[instance].focus }}

    ## Your Task
    Investigate from your perspective using the preprocessed data. You are
    working independently — other analysts are investigating the same system
    from different angles. You cannot see their work.

    {% if instance == 1 %}
    Investigate the STRUCTURE:
    - Read every module. Trace data flow from CLI entry → pipeline → analyzers → extractors → output
    - Does SceneDetector output feed correctly into AudioAnalyzer, VisualAnalyzer, SemanticAnalyzer?
    - Does ViralityScorer receive the right data from all three analyzers?
    - Does ClipExtractor get the right scene boundaries?
    - Does the CSV contain data from all pipeline stages?
    - Are the dataclass contracts (models.py) honored everywhere?
    - Does process_youtube() correctly chain download → process?

    {% elif instance == 2 %}
    Investigate the OPERATIONS:
    - Use the preprocessed CLI outputs — what actually happened when commands ran?
    - Are there warnings in the preprocessed warning capture?
    - What does `check` output look like? Is it clean and helpful?
    - What happens when processing the 30s test video? Did it produce output?
    - Is bootstrap.ensure_ready() called before pipeline operations?
    - Does __main__.py handle missing deps gracefully?
    - Read {{ yt_transcriber }}/setup.sh — what patterns should we adopt?
    - What would a new user's experience be after git clone?

    {% elif instance == 3 %}
    Investigate the QUALITY:
    - The preprocessed data shows test results — analyze them
    - Read every test file. For each test: if implementation returned None,
      would this test still pass? Count meaningful vs decorative tests.
    - What code paths have ZERO test coverage?
    - What option combinations (--no-captions, --no-semantic, --no-vertical)
      are tested? Which are missing?
    - Check all imports for deprecated APIs (numpy, opencv, librosa, scenedetect)
    - Check requirements-clip-extractor.txt for version issues
    - What adversarial inputs would break the tool?
    {% endif %}

    Produce:
    - **Findings**: What you discovered (with evidence: file paths, line numbers)
    - **Assessment**: Your answer to your guiding question
    - **Concerns**: What worries you most
    - **Recommendations**: Specific, actionable improvements

    {{ output_spec("03-lens-" ~ instance ~ ".md") }}
    {{ quality_bar("high") }}

    {% elif stage == 4 %}
    # Synthesis

    {{ ctx() }}
    {{ warn_rule() }}

    Read all investigation outputs:
    - {{ workspace }}/score-artifacts/01-framing.md (framing)
    - {{ workspace }}/score-artifacts/02-preprocessing.md (raw data)
    {% for i in range(1, 4) %}
    - {{ workspace }}/score-artifacts/03-lens-{{ i }}.md ({{ lenses[i].name }} lens)
    {% endfor %}

    ## Your Task
    Three independent investigators analyzed this codebase. Synthesize their
    findings into an actionable fix plan.

    ### Part 1: Meta-Analysis
    1. **Convergences** — where did they agree without coordination? This is signal.
    2. **Tensions** — where do they disagree? Don't average. Find a reading
       that makes both true, or explain the irreducible tension.
    3. **Blind spots** — what did ALL three miss?
    4. **Emergence** — what insight exists in the collision that no single
       investigator stated?

    ### Part 2: Prioritized Fix Plan
    Produce a concrete, ordered plan organized by these three execution tracks
    (which will run in parallel):

    **Track 1 — Code Fixes** ({{ workers[1].name }}):
    List every code change needed, in priority order. Include file paths.
    - Bootstrap wiring (__main__.py, cli.py)
    - Pipeline bugs
    - Module fixes
    - Warning elimination
    - Output cleanup

    **Track 2 — Test Overhaul** ({{ workers[2].name }}):
    List every test change needed.
    - Which existing tests to keep, rewrite, or delete
    - Integration tests to write (using fixtures at {{ test_video_dir }})
    - Adversarial tests to write
    - Coverage targets: 80% line, 70% branch

    **Track 3 — Setup & Polish** ({{ workers[3].name }}):
    List everything needed for first-run experience.
    - setup.sh creation (follow {{ yt_transcriber }}/setup.sh pattern)
    - requirements-clip-extractor.txt updates
    - pytest.ini configuration (markers, coverage)
    - Synthetic test fixture management

    ### Part 3: Shared Contracts
    Define interfaces that all three tracks must respect:
    - Test fixture paths ({{ test_video_dir }}/*)
    - pytest markers (integration, adversarial, slow)
    - File naming conventions
    - Import patterns

    {{ output_spec("04-synthesis.md") }}
    {{ quality_bar("high") }}

    {% elif stage == 5 %}
    # Execute: {{ workers[instance].name }}

    {{ ctx() }}
    {{ warn_rule() }}

    Read the synthesis and fix plan at {{ workspace }}/score-artifacts/04-synthesis.md.
    Follow your track's instructions precisely. The synthesis defines what to do.

    Also read the preprocessed data at {{ workspace }}/score-artifacts/02-preprocessing.md
    for context on what's currently broken.

    {% if instance == 1 %}
    ## Track 1: Code Fixes

    Execute every code fix listed in Track 1 of the synthesis.

    Key areas (synthesis provides specifics):
    1. Wire bootstrap.ensure_ready() into __main__.py and cli.py
    2. Fix pipeline bugs found by the structural investigator
    3. Fix module issues found by all three investigators
    4. Eliminate all warnings from our code
    5. Add targeted warning filters for third-party warnings at entry points
    6. Clean up logging and user-facing output

    After all fixes, verify:
    ```bash
    cd {{ workspace }}
    python -m viral_clip_extractor check
    python -W error -c "
    import warnings
    warnings.filterwarnings('error', module='viral_clip_extractor')
    from viral_clip_extractor.pipeline import ViralClipPipeline
    print('No warnings from our code')
    "
    python -m pytest tests/ -x -q 2>&1
    ```

    {{ output_spec(workers[instance].report) }}

    {% elif instance == 2 %}
    ## Track 2: Test Overhaul

    Execute every test change listed in Track 2 of the synthesis.

    ### Test Fixtures
    Use the pre-downloaded fixtures at {{ test_video_dir }}/:
    - rickroll_30s.mp4 (30-second clip for fast tests)
    - Full rickroll video (for golden-path E2E)
    - synthetic_1s.mp4 (1-second test video)
    - synthetic_noaudio.mp4 (video without audio)
    - synthetic_singleframe.mp4 (single frame)

    ### Required Work
    1. **Audit existing tests** per synthesis instructions — keep meaningful
       ones, rewrite decorative ones, delete useless ones
    2. **Write integration tests** ({{ workspace }}/tests/test_integration.py):
       - Test ALL 8 option combinations with real video
       - Test each analyzer against real video
       - Test YouTube download
       - Test full pipeline E2E (30s clip + full rickroll golden path)
       - Test CSV output structure
       - Test CLI check command
       - Mark with @pytest.mark.integration
    3. **Write adversarial tests** ({{ workspace }}/tests/test_adversarial.py):
       - Invalid inputs, malformed URLs, edge case videos
       - Config edge cases, resource cleanup
       - Bootstrap resilience, pipeline error recovery
       - Mark with @pytest.mark.adversarial

    ### Test ALL Option Combinations
    The CLI has 3 boolean flags: --no-captions, --no-semantic, --no-vertical
    That's 2^3 = 8 combinations. Every one needs an E2E test using the 30s clip.

    After writing, run:
    ```bash
    cd {{ workspace }} && python -m pytest tests/ -v --tb=short 2>&1
    ```

    {{ output_spec(workers[instance].report) }}

    {% elif instance == 3 %}
    ## Track 3: Setup & Polish

    Execute every setup change listed in Track 3 of the synthesis.

    ### 1. Create setup.sh
    Study {{ yt_transcriber }}/setup.sh carefully. Create {{ workspace }}/setup.sh:
    - OS detection (Ubuntu/Debian, Fedora/RHEL, Arch, macOS, WSL)
    - Check and install ffmpeg with OS-specific commands
    - Install Python deps from requirements-clip-extractor.txt
    - Pull Ollama model: ollama pull qwen2.5vl:7b
    - Verify everything after install
    - Colored output with status indicators
    - Idempotent (safe to run multiple times)
    - chmod +x

    ### 2. Update requirements-clip-extractor.txt
    Per synthesis recommendations. Ensure version compatibility.

    ### 3. Update pytest.ini
    ```ini
    [pytest]
    testpaths = tests
    pythonpath = .
    addopts = -p no:randomly
    markers =
        integration: integration tests (may download from internet)
        adversarial: adversarial edge-case tests
        slow: slow tests (full video processing)
    ```

    ### 4. Verify setup.sh
    ```bash
    bash -n {{ workspace }}/setup.sh && echo "Syntax OK"
    ```

    {{ output_spec(workers[instance].report) }}
    {% endif %}

    {% elif stage == 6 %}
    # Adversarial Review: {{ reviewers[instance].name | title }}

    {{ ctx() }}

    Read the synthesis at {{ workspace }}/score-artifacts/04-synthesis.md
    and all execution reports:
    {% for i in range(1, 4) %}
    - {{ workspace }}/score-artifacts/{{ workers[i].report }}
    {% endfor %}

    ## CRITICAL: Do Not Trust the Execution Reports
    The workers may claim success while leaving real issues. Your job is
    to find problems by RUNNING CODE, not by reading reports.

    ## Your Review Focus
    {{ reviewers[instance].focus }}

    {% if instance == 1 %}
    ## Completeness Review
    For every item in the synthesis fix plan, verify it was addressed:
    - Was every code fix from Track 1 applied?
    - Were all test changes from Track 2 made?
    - Was setup.sh created per Track 3?
    - Were ALL 8 option combinations tested?
    - Cross-reference synthesis recommendations against actual changes.

    {% elif instance == 2 %}
    ## Correctness Review
    Run commands and verify things actually work:
    ```bash
    cd {{ workspace }}
    # Bootstrap works
    python -m viral_clip_extractor check
    # No warnings
    python -W error -c "
    import warnings
    warnings.filterwarnings('error', module='viral_clip_extractor')
    from viral_clip_extractor.pipeline import ViralClipPipeline
    "
    # Tests pass
    python -m pytest tests/ -x -q --tb=short 2>&1
    # Process a real video
    python -m viral_clip_extractor process \
      --video {{ test_video_dir }}/rickroll_30s.mp4 \
      --title "Review Test" \
      --output-dir /tmp/vce_review_test \
      --no-semantic --top-n 2 --min-score 0 2>&1
    # Cleanup
    rm -rf /tmp/vce_review_test
    ```
    Fix anything broken. Don't just report — repair.

    {% elif instance == 3 %}
    ## Robustness Review
    Try to break things:
    ```bash
    cd {{ workspace }}
    # Edge case: non-existent file
    python -m viral_clip_extractor process --video /nonexistent 2>&1 || true
    # Edge case: all features disabled
    python -m viral_clip_extractor process \
      --video {{ test_video_dir }}/rickroll_30s.mp4 \
      --output-dir /tmp/vce_robust_test \
      --no-semantic --no-captions --no-vertical \
      --top-n 1 --min-score 0 2>&1 || true
    # Edge case: 1-second video
    python -m viral_clip_extractor process \
      --video {{ test_video_dir }}/synthetic_1s.mp4 \
      --output-dir /tmp/vce_robust_test2 \
      --no-semantic --top-n 1 --min-score 0 2>&1 || true
    # Cleanup
    rm -rf /tmp/vce_robust_test /tmp/vce_robust_test2
    ```
    Check for clean error messages, no tracebacks, proper cleanup.
    Fix anything broken.
    {% endif %}

    Produce:
    - **Problems Found**: Specific issues with evidence
    - **Fixes Applied**: What you repaired
    - **Missing Elements**: What should exist but doesn't
    - **Verdict**: Acceptable / Needs revision / Fundamentally flawed

    {{ output_spec("06-review-" ~ instance ~ ".md") }}

    {% elif stage == 7 %}
    # Final Deliverable

    {{ ctx() }}
    {{ warn_rule() }}

    Read all reviews:
    {% for i in range(1, 4) %}
    - {{ workspace }}/score-artifacts/06-review-{{ i }}.md ({{ reviewers[i].name }})
    {% endfor %}

    And the synthesis: {{ workspace }}/score-artifacts/04-synthesis.md

    ## Your Task
    Incorporate all review feedback, fix remaining issues, and verify
    EVERYTHING works end-to-end. You are the final gatekeeper.

    ### 1. Address Review Findings
    Read each review. Fix every problem flagged. Apply every suggestion
    that improves quality.

    ### 2. Install coverage tools
    ```bash
    pip install pytest-cov --break-system-packages 2>/dev/null || \
    pip install pytest-cov --user 2>/dev/null || pip install pytest-cov
    ```

    ### 3. Run full test suite with coverage
    ```bash
    cd {{ workspace }} && python -m pytest tests/ -v --tb=short \
      --cov=viral_clip_extractor \
      --cov-report=term-missing \
      --cov-report=html:{{ workspace }}/score-artifacts/coverage-html \
      --cov-branch 2>&1
    ```
    If coverage is below 80% line / 70% branch, write additional tests.

    ### 4. Full E2E Smoke Test
    Run every CLI command and option:

    ```bash
    cd {{ workspace }}

    # check
    python -m viral_clip_extractor check

    # help (all subcommands)
    python -m viral_clip_extractor --help
    python -m viral_clip_extractor process --help
    python -m viral_clip_extractor youtube --help
    python -m viral_clip_extractor batch --help

    # process with 30s clip — all 8 option combinations
    for CAPTIONS in "" "--no-captions"; do
      for SEMANTIC in "" "--no-semantic"; do
        for VERTICAL in "" "--no-vertical"; do
          FLAGS="$CAPTIONS $SEMANTIC $VERTICAL"
          DIRNAME="smoke_$(echo $FLAGS | tr ' ' '_' | tr -d '-')"
          echo "=== Testing: $FLAGS ==="
          python -m viral_clip_extractor process \
            --video {{ test_video_dir }}/rickroll_30s.mp4 \
            --title "Smoke $FLAGS" \
            --output-dir /tmp/vce_smoke/$DIRNAME \
            --top-n 2 --min-score 0 \
            $FLAGS 2>&1 || echo "FAILED: $FLAGS"
        done
      done
    done

    # youtube subcommand
    python -m viral_clip_extractor youtube \
      --url "{{ rickroll_url }}" \
      --output-dir /tmp/vce_smoke/youtube \
      --no-semantic --top-n 2 --min-score 0 2>&1

    # batch subcommand
    mkdir -p /tmp/vce_smoke/batch_in
    cp {{ test_video_dir }}/rickroll_30s.mp4 /tmp/vce_smoke/batch_in/v1.mp4
    python -m viral_clip_extractor batch \
      --videos-dir /tmp/vce_smoke/batch_in \
      --output-dir /tmp/vce_smoke/batch_out \
      --no-semantic --top-n 2 --min-score 0 2>&1
    ```

    ### 5. Verify CSV quality
    ```bash
    python -c "
    import csv, os, glob
    for csv_path in glob.glob('/tmp/vce_smoke/**/clips_report.csv', recursive=True):
        with open(csv_path) as f:
            reader = csv.DictReader(f)
            rows = list(reader)
        print(f'{csv_path}: {len(rows)} clips, columns={len(reader.fieldnames)}')
    "
    ```

    ### 6. Verify clean output (no warnings in stderr)
    ```bash
    cd {{ workspace }} && python -m viral_clip_extractor process \
      --video {{ test_video_dir }}/rickroll_30s.mp4 \
      --title "Clean Check" \
      --output-dir /tmp/vce_smoke/clean_check \
      --no-semantic --no-captions --top-n 1 --min-score 0 \
      2>/tmp/vce_smoke/stderr.txt
    if [ -s /tmp/vce_smoke/stderr.txt ]; then
      echo "STDERR NOT EMPTY:"
      cat /tmp/vce_smoke/stderr.txt
    else
      echo "CLEAN: no stderr output"
    fi
    ```

    ### 7. Verify setup.sh
    ```bash
    bash -n {{ workspace }}/setup.sh && echo "setup.sh syntax OK"
    ```

    ### 8. Final test run
    ```bash
    cd {{ workspace }} && python -m pytest tests/ -q --tb=short 2>&1
    ```

    ### 9. Cleanup
    ```bash
    rm -rf /tmp/vce_smoke
    ```

    ## Write Final Report

    {{ output_spec("07-final.md") }}
    {{ quality_bar("high") }}

    Include:
    - **Review Integration**: What changed based on each reviewer's feedback
    - **Coverage Report**: Line %, branch %, per-module breakdown
    - **E2E Results**: Table of every command/option tested with PASS/FAIL
    - **Remaining Issues**: Anything not fully resolved (be honest)
    - **Final Verdict**: PASS or FAIL with evidence
    {% endif %}

validations:
  # === Stage 1: Framing ===
  - type: file_exists
    path: "{workspace}/score-artifacts/01-framing.md"
    condition: "stage == 1"
    stage: 1
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/score-artifacts/01-framing.md") -ge 300'
    condition: "stage == 1"
    stage: 2
    description: "Framing has substantive content"

  # === Stage 2: Preprocessing ===
  - type: file_exists
    path: "{workspace}/score-artifacts/02-preprocessing.md"
    condition: "stage == 2"
    stage: 1
  - type: content_regex
    path: "{workspace}/score-artifacts/02-preprocessing.md"
    pattern: "(?si)(Test Video Fixtures|CLI Command Outputs|Import Warnings|Test Suite Results)"
    condition: "stage == 2"
    stage: 2
    description: "Preprocessing has required data sections"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/score-artifacts/02-preprocessing.md") -ge 500'
    condition: "stage == 2"
    stage: 2
    description: "Preprocessing has substantive content"
  - type: command_succeeds
    command: 'test -f "{workspace}/../vce_test_fixtures/rickroll_30s.mp4" -o -f "/tmp/vce_test_fixtures/rickroll_30s.mp4"'
    condition: "stage == 2"
    stage: 2
    retry_count: 5
    retry_delay_ms: 2000
    description: "30-second test video fixture exists"
  - type: command_succeeds
    command: 'ollama list 2>/dev/null | grep -q "qwen2.5vl"'
    condition: "stage == 2"
    stage: 2
    description: "Ollama qwen2.5vl model available"

  # === Stage 3: Investigation Lenses ===
  - type: file_exists
    path: "{workspace}/score-artifacts/03-lens-{instance}.md"
    condition: "stage == 3"
    stage: 1
  - type: content_regex
    path: "{workspace}/score-artifacts/03-lens-{instance}.md"
    pattern: "(?si)(finding|assessment|recommendation)"
    condition: "stage == 3"
    stage: 2
    description: "Investigation has findings, assessment, or recommendations"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/score-artifacts/03-lens-{instance}.md") -ge 600'
    condition: "stage == 3"
    stage: 2
    description: "Investigation has substantive content"

  # === Stage 4: Synthesis ===
  - type: file_exists
    path: "{workspace}/score-artifacts/04-synthesis.md"
    condition: "stage == 4"
    stage: 1
  - type: content_regex
    path: "{workspace}/score-artifacts/04-synthesis.md"
    pattern: "(?si)(convergence|tension|emergence)"
    condition: "stage == 4"
    stage: 2
    description: "Synthesis addresses convergences, tensions, emergence"
  - type: content_contains
    path: "{workspace}/score-artifacts/04-synthesis.md"
    pattern: "Track 1"
    condition: "stage == 4"
    stage: 2
    description: "Synthesis has execution track plan"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/score-artifacts/04-synthesis.md") -ge 1000'
    condition: "stage == 4"
    stage: 2
    description: "Synthesis has substantial content"

  # === Stage 5: Execution ===
  # Worker 1: Code fixes
  - type: command_succeeds
    command: 'cd {workspace} && python -m viral_clip_extractor check 2>&1'
    condition: "stage == 5 and instance == 1"
    stage: 1
    description: "check command works after code fixes"
  - type: command_succeeds
    command: 'PYTHONPATH={workspace} python -c "import warnings; warnings.filterwarnings(\"error\", module=\"viral_clip_extractor\"); from viral_clip_extractor.pipeline import ViralClipPipeline; print(\"OK\")"'
    condition: "stage == 5 and instance == 1"
    stage: 2
    description: "No warnings from our code"
  - type: file_exists
    path: "{workspace}/score-artifacts/05-exec-code.md"
    condition: "stage == 5 and instance == 1"
    stage: 2
    description: "Code fixes report written"

  # Worker 2: Tests
  - type: file_exists
    path: "{workspace}/tests/test_integration.py"
    condition: "stage == 5 and instance == 2"
    stage: 1
    description: "Integration test file exists"
  - type: file_exists
    path: "{workspace}/tests/test_adversarial.py"
    condition: "stage == 5 and instance == 2"
    stage: 1
    description: "Adversarial test file exists"
  - type: command_succeeds
    command: 'test $(grep -c "def test_" "{workspace}/tests/test_integration.py") -ge 8'
    condition: "stage == 5 and instance == 2"
    stage: 2
    description: "At least 8 integration test functions"
  - type: command_succeeds
    command: 'test $(grep -c "def test_" "{workspace}/tests/test_adversarial.py") -ge 10'
    condition: "stage == 5 and instance == 2"
    stage: 2
    description: "At least 10 adversarial test functions"
  - type: command_succeeds
    command: 'cd {workspace} && python -m pytest tests/test_adversarial.py -v --tb=short 2>&1'
    condition: "stage == 5 and instance == 2"
    stage: 2
    description: "Adversarial tests actually pass"
  - type: content_contains
    path: "{workspace}/pytest.ini"
    pattern: "integration"
    condition: "stage == 5 and instance == 2"
    stage: 2
    description: "pytest.ini has integration marker registered"
  - type: file_exists
    path: "{workspace}/score-artifacts/05-exec-tests.md"
    condition: "stage == 5 and instance == 2"
    stage: 2
    description: "Test overhaul report written"

  # Worker 3: Setup
  - type: file_exists
    path: "{workspace}/setup.sh"
    condition: "stage == 5 and instance == 3"
    stage: 1
    description: "setup.sh exists"
  - type: command_succeeds
    command: 'bash -n "{workspace}/setup.sh"'
    condition: "stage == 5 and instance == 3"
    stage: 2
    description: "setup.sh is syntactically valid"
  - type: file_exists
    path: "{workspace}/score-artifacts/05-exec-setup.md"
    condition: "stage == 5 and instance == 3"
    stage: 2
    description: "Setup report written"

  # === Stage 6: Adversarial Review ===
  - type: file_exists
    path: "{workspace}/score-artifacts/06-review-{instance}.md"
    condition: "stage == 6"
    stage: 1
  - type: content_contains
    path: "{workspace}/score-artifacts/06-review-{instance}.md"
    pattern: "## Verdict"
    condition: "stage == 6"
    stage: 2
    description: "Review includes a verdict"

  # === Stage 7: Final ===
  - type: file_exists
    path: "{workspace}/score-artifacts/07-final.md"
    condition: "stage == 7"
    stage: 1
  - type: content_contains
    path: "{workspace}/score-artifacts/07-final.md"
    pattern: "Review Integration"
    condition: "stage == 7"
    stage: 2
    description: "Final report documents review integration"
  - type: command_succeeds
    command: 'cd {workspace} && python -m viral_clip_extractor check 2>&1'
    condition: "stage == 7"
    stage: 2
    description: "check command passes in final verification"
  - type: command_succeeds
    command: 'cd {workspace} && python -m pytest tests/ -q --tb=short --cov=viral_clip_extractor --cov-branch --cov-fail-under=80 2>&1'
    condition: "stage == 7"
    stage: 2
    description: "Full test suite passes with >= 80% line coverage"
  - type: content_regex
    path: "{workspace}/score-artifacts/07-final.md"
    pattern: "(?i)final verdict.*pass"
    condition: "stage == 7"
    stage: 2
    description: "Final verdict is PASS"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/score-artifacts/07-final.md") -ge 2000'
    condition: "stage == 7"
    stage: 2
    description: "Final report has substantial content"
