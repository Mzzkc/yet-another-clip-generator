[Model]
model_name = qwen2.5-vl:7b
ollama_host = http://localhost:11434

[Paths]
output_directory = ./clip_output
transcript_cache = ./transcripts

[Scene Detection]
threshold = 3.0
min_scene_length = 7.0
max_scene_length = 60.0

[Analysis]
enable_semantic = true
enable_captions = true
enable_transcript = false

[Clip Settings]
top_n_clips = 10
min_virality_score = 70
vertical_crop = true
context_padding = 2.0

[Scoring Weights]
hook_potential = 0.20
emotional_intensity = 0.15
audio_peaks = 0.15
asmr_quality = 0.12
motion = 0.12
narrative_interest = 0.10
high_freq = 0.10
uniqueness = 0.08
visual_interest = 0.07
duration_optimal = 0.05

[ASMR]
asmr_mode = true
trigger_keywords = tingles,relax,sleep,cozy,gentle,dragon,scales,whisper,magic

[YouTube]
download_dir = ./downloads
cleanup_after_processing = false
