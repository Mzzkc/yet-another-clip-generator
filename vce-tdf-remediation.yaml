    ## Your Task

    Perform a collision analysis of the five reviews.

    ### Part 1: Collision Analysis

    **Convergences**: Where did independent reviewers reach the same
    conclusion? This is signal — it wasn't coordinated.

    **Tensions**: Where do they disagree? Don't resolve by averaging.
    Find a reading that makes both positions true.

    **Blind Spots**: What did ALL five reviewers miss?

    **Emergence**: What insight exists in the collision of perspectives
    that no single reviewer stated?

    ### Part 2: Unified Priority Queue

    Merge all issues into a single deduplicated priority queue.
