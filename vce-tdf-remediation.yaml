validations:
  # === Stage 1: Preprocessing ===
  - type: file_exists
    path: "{workspace}/score-artifacts/preprocess-{instance}.md"
    condition: "stage == 1"
    stage: 1
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/score-artifacts/preprocess-{instance}.md") -ge 300'
    condition: "stage == 1"
    stage: 2
    description: "Preprocessing report has substantive content (300+ words)"

  # === Stage 2: Remediation Round 1 ===
  - type: file_exists
    path: "{workspace}/score-artifacts/remediation-{instance}.md"
    condition: "stage == 2"
    stage: 1
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/score-artifacts/remediation-{instance}.md") -ge 200'
    condition: "stage == 2"
    stage: 2
    description: "Remediation report has substantive content"
  - type: command_succeeds
    command: 'cd /home/emzi/Projects/yacg && python -m pytest tests/ -x --tb=line --override-ini="addopts="'
    condition: "stage == 2"
    stage: 3
    description: "Tests pass after remediation round 1"

  # === Stage 3: TDF Review ===
  - type: file_exists
    path: "{workspace}/score-artifacts/review1-{instance}.md"
    condition: "stage == 3"
    stage: 1
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/score-artifacts/review1-{instance}.md") -ge 500'
    condition: "stage == 3"
    stage: 2
    description: "TDF review has substantive content (500+ words)"
  - type: content_regex
    path: "{workspace}/score-artifacts/review1-{instance}.md"
    pattern: "(?si)Issue count:\\s*\\d+"
    condition: "stage == 3"
    stage: 2
    description: "TDF review has issue count"

  # === Stage 4: TDF Synthesis ===
  - type: file_exists
    path: "{workspace}/score-artifacts/synthesis1.md"
    condition: "stage == 4"
    stage: 1
  - type: content_regex
    path: "{workspace}/score-artifacts/synthesis1.md"
    pattern: "(?si)Issue count:\\s*\\d+"
    condition: "stage == 4"
    stage: 2
    description: "Synthesis has issue count"

  # === Stage 5: Remediation Round 2 ===
  - type: file_exists
    path: "{workspace}/score-artifacts/remediation2-{instance}.md"
    condition: "stage == 5"
    stage: 1
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/score-artifacts/remediation2-{instance}.md") -ge 100'
    condition: "stage == 5"
    stage: 2
    description: "Remediation 2 report has content"
  - type: command_succeeds
    command: 'cd /home/emzi/Projects/yacg && python -m pytest tests/ -x --tb=line --override-ini="addopts="'
    condition: "stage == 5"
    stage: 3
    description: "Tests pass after remediation round 2"

  # === Stage 6: Review Round 2 ===
  - type: file_exists
    path: "{workspace}/score-artifacts/review2-{instance}.md"
    condition: "stage == 6"
    stage: 1
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/score-artifacts/review2-{instance}.md") -ge 300'
    condition: "stage == 6"
    stage: 2
    description: "Review 2 has substantive content"
  - type: content_regex
    path: "{workspace}/score-artifacts/review2-{instance}.md"
    pattern: "(?si)Issue count:\\s*\\d+"
    condition: "stage == 6"
    stage: 2
    description: "Review 2 has issue count"

  # === Stage 7: Review 2 Synthesis ===
  - type: file_exists
    path: "{workspace}/score-artifacts/synthesis2.md"
    condition: "stage == 7"
    stage: 1
  - type: content_regex
    path: "{workspace}/score-artifacts/synthesis2.md"
    pattern: "(?si)Issue count:\\s*\\d+"
    condition: "stage == 7"
    stage: 2
    description: "Synthesis 2 has issue count"

  # === Stage 8: Final Remediation (conditional) ===
  - type: file_exists
    path: "{workspace}/score-artifacts/final-remediation.md"
    condition: "stage == 8"
    stage: 1
  - type: command_succeeds
    command: 'cd /home/emzi/Projects/yacg && python -m pytest tests/ -x --tb=line --override-ini="addopts="'
    condition: "stage == 8"
    stage: 2
    description: "Tests pass after final remediation"

  # === Stage 9: Docs Research ===
  - type: file_exists
    path: "{workspace}/score-artifacts/docs-audit.md"
    condition: "stage == 9 and instance == 1"
    stage: 1
  - type: file_exists
    path: "{workspace}/score-artifacts/docs-inventory.md"
    condition: "stage == 9 and instance == 2"
    stage: 1
  - type: file_exists
    path: "{workspace}/score-artifacts/docs-architecture.md"
    condition: "stage == 9 and instance == 3"
    stage: 1

  # === Stage 10: Docs Write ===
  - type: file_exists
    path: "{workspace}/score-artifacts/docs-write.md"
    condition: "stage == 10"
    stage: 1
  - type: command_succeeds
    command: 'cd /home/emzi/Projects/yacg && pip install mkdocs mkdocs-material -q 2>/dev/null && mkdocs build --strict 2>&1'
    condition: "stage == 10"
    stage: 2
    description: "MkDocs builds without errors"

  # === Stage 11: Docs Review ===
  - type: file_exists
    path: "{workspace}/score-artifacts/docs-review.md"
    condition: "stage == 11"
    stage: 1
  - type: command_succeeds
    command: 'cd /home/emzi/Projects/yacg && mkdocs build --strict 2>&1'
    condition: "stage == 11"
    stage: 2
    description: "MkDocs still builds after review fixes"
