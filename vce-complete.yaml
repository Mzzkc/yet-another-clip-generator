# vce-complete.yaml
#
# Pattern: Tier 5 Complex Implementation (14 stages, 34 sheets)
# Goal: One-shot the rest of VCE development:
#   1. Transcript-first pipeline inversion (LLM-driven segmentation)
#   2. TikTok word-pop burned-in subtitles
#   3. Remove all optional feature flags
#   4. Harden all failure paths (no silent fallbacks)
#   5. Fix smart cropper
#   6. GitHub Pages documentation
#
# Execution Flow:
#   Stage 1:  Frame — success criteria, change manifest (1 sheet)
#   Stage 2:  Preprocess — per-worker thinking step (fan-out x5)
#   Stage 3:  Execute — 5 parallel workers (fan-out x5)
#   Stage 4:  Test Rewrite — update test suite (1 sheet)
#   Stage 5:  Adversarial Review — 3 lenses (fan-out x3)
#   Stage 6:  Remediation 1 — per-worker-domain fixes (fan-out x5)
#   Stage 7:  TDF Review — 5 persona lenses (fan-out x5)
#   Stage 8:  TDF Synthesis — collide perspectives (1 sheet)
#   Stage 9:  Remediation 2 — conditional, skip if 0 issues (1 sheet)
#   Stage 10: Live E2E — run tool on real video + pytest (1 sheet)
#   Stage 11: Final Remediation — conditional, skip if E2E clean (1 sheet)
#   Stage 12: Docs Research — 3 parallel workers (fan-out x3)
#   Stage 13: Docs Write — create GitHub Pages site (1 sheet)
#   Stage 14: Docs Review — verify docs build + accuracy (1 sheet)

name: "vce-complete"
workspace: "/home/emzi/Projects/yacg/workspaces/vce-complete-workspace"

backend:
  type: claude_cli
  skip_permissions: true
  disable_mcp: true
  timeout_seconds: 2400
  output_format: text
  timeout_overrides:
    2: 3600     # Preprocess: reads files, runs dep checks
    3: 3600     # Execute workers: significant code changes
    4: 3600     # Test rewrite: many files to update
    6: 3600     # Remediation 1: fix review issues
    9: 3600     # Remediation 2: 6 parallel agents fixing P1/P2/P3
    10: 5400    # Live E2E: downloads video, processes, verifies
    11: 3600    # Final remediation
    12: 3600    # Docs research: web research + code audit
    13: 3600    # Docs write: create full documentation site

sheet:
  size: 1
  total_items: 14
  fan_out:
    2: 5    # 5 preprocessing workers (thinking step per execution worker)
    3: 5    # 5 execution workers
    5: 3    # 3 adversarial reviewers
    6: 5    # 5 remediators (aligned with worker domains)
    7: 5    # 5 TDF persona reviewers
    9: 6    # 6 remediation agents (2 per priority: P1, P2, P3)
    12: 3   # 3 docs research workers
  dependencies:
    2: [1]
    3: [2]
    4: [3]
    5: [4]
    6: [5]
    7: [6]
    8: [7]
    9: [8]
    10: [9]
    11: [10]
    12: [11]
    13: [12]
    14: [13]
  skip_when_command:
    9:
      command: 'grep -q "Issue count: 0" "{workspace}/score-artifacts/08-tdf-synthesis.md"'
      description: "Skip remediation 2 if TDF synthesis found zero issues"
      timeout_seconds: 10
    11:
      command: 'grep -q "LIVE E2E: ALL PASS" "{workspace}/score-artifacts/10-live-e2e.md"'
      description: "Skip final remediation if live E2E passed clean"
      timeout_seconds: 10

parallel:
  enabled: true
  max_concurrent: 5

cross_sheet:
  auto_capture_stdout: true
  max_output_chars: 10000
  lookback_sheets: 10
  capture_files:
    - "{{ workspace }}/score-artifacts/02-preprocess-1.md"
    - "{{ workspace }}/score-artifacts/02-preprocess-2.md"
    - "{{ workspace }}/score-artifacts/02-preprocess-3.md"
    - "{{ workspace }}/score-artifacts/02-preprocess-4.md"
    - "{{ workspace }}/score-artifacts/02-preprocess-5.md"
    - "{{ workspace }}/score-artifacts/08-tdf-synthesis.md"

retry:
  max_retries: 2
  base_delay_seconds: 15
  max_completion_attempts: 3
  completion_threshold_percent: 100

rate_limit:
  wait_minutes: 60
  max_waits: 12

stale_detection:
  enabled: true
  idle_timeout_seconds: 3600

prompt:
  variables:
    project: "/home/emzi/Projects/yacg"
    design_doc: "/home/emzi/Projects/yacg/docs/plans/2026-03-05-subtitles-and-hardening-design.md"
    test_video_dir: "/tmp/vce_test_fixtures"
    rickroll_url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"

    workers:
      1:
        name: "foundation"
        focus: "models.py, config.py, bootstrap.py, transcript_bridge.py removal"
        report: "03-exec-foundation.md"
        preprocess_report: "02-preprocess-1.md"
        files: "models.py, utils/config.py, bootstrap.py, transcript_bridge.py"
      2:
        name: "transcript-segmenter"
        focus: "New transcript_segmenter.py — Whisper transcription + LLM segmentation"
        report: "03-exec-segmenter.md"
        preprocess_report: "02-preprocess-2.md"
        files: "core/audio_analyzer.py (Whisper patterns), faster-whisper API, Ollama API"
      3:
        name: "subtitle-burner"
        focus: "New subtitle_burner.py — ASS generation + FFmpeg burn-in"
        report: "03-exec-subtitles.md"
        preprocess_report: "02-preprocess-3.md"
        files: "FFmpeg libass, ASS format, subtitle positioning"
      4:
        name: "pipeline-and-cropper"
        focus: "pipeline.py rewrite, scene_detector.py demotion, smart_cropper.py fix"
        report: "03-exec-pipeline.md"
        preprocess_report: "02-preprocess-4.md"
        files: "pipeline.py, core/scene_detector.py, extractors/smart_cropper.py"
      5:
        name: "hardening-and-cli"
        focus: "semantic_analyzer.py, caption_generator.py, clip_extractor.py, cli.py"
        report: "03-exec-hardening.md"
        preprocess_report: "02-preprocess-5.md"
        files: "core/semantic_analyzer.py, caption_generator.py, extractors/clip_extractor.py, cli.py"

    reviewers:
      1:
        name: "completeness"
        focus: "Did every item from the preprocessing manifests get addressed? What was skipped?"
      2:
        name: "correctness"
        focus: "Does the code actually work? Run it. Test it. Verify claims."
      3:
        name: "robustness"
        focus: "Try to break it — silent video, edge cases, Ollama down, resource cleanup."

    tdf_lenses:
      1:
        name: "youtube-creator"
        voice: >-
          You are a YouTube creator with 500K subscribers who can barely
          use a command line. You know what makes good short-form content
          but you're not technical. You care about: does this tool actually
          produce clips I can post? Are the subtitles readable? Is the
          error output gibberish or helpful? Would I use this over OpusClip?
        focus: "Usability, output quality, subtitle readability, error clarity, competitive value"
        question: "Would I actually use this tool, or would I give up and go back to OpusClip?"
      2:
        name: "ai-builder"
        voice: >-
          You are an AI engineer who builds cool shit and ships fast.
          You care about clean APIs, extensibility, and whether the
          architecture lets you hack on it. You want to fork this and
          add features. You hate over-engineering but love good abstractions.
        focus: "API design, extensibility, code quality, developer experience, hackability"
        question: "Can I fork this and build on it, or is the architecture going to fight me?"
      3:
        name: "graduate-professor"
        voice: >-
          You are a graduate-level computer science professor evaluating
          this as a student project submission. You grade on rigor,
          methodology, correctness, and whether the approach is sound.
          You're not impressed by volume — you want to see clear thinking.
        focus: "Algorithmic correctness, methodology, code structure, documentation quality, rigor"
        question: "Is this well-engineered, or is it duct tape that happens to run?"
      4:
        name: "systems-engineer"
        voice: >-
          You are a systems engineer who happened across this project.
          You think about reliability, resource usage, failure modes,
          deployment, and what happens at 3am when nobody is watching.
          You've been burned by tools that work in demos but break in
          production.
        focus: "Reliability, resource management, failure handling, deployment, monitoring, scalability"
        question: "Will this run reliably on someone else's machine, or only on the developer's?"
      5:
        name: "ml-expert"
        voice: >-
          You are an ML engineer who works with speech models, vision
          models, and multimodal pipelines daily. You know faster-whisper
          internals, Ollama quirks, and where ML pipelines silently
          degrade. You care about model selection, inference quality,
          and whether the ML components are used correctly.
        focus: "Whisper usage, Ollama integration, model selection, inference quality, ML pipeline correctness"
        question: "Are the ML components used correctly, or is this cargo-culting API calls?"

    docs_workers:
      1:
        name: "framework-research"
        focus: "Research documentation frameworks and best practices for Python CLI tools on GitHub Pages"
        report: "12-docs-research.md"
      2:
        name: "codebase-audit"
        focus: "Audit existing code docstrings, README, and documentation content"
        report: "12-docs-audit.md"
      3:
        name: "architecture-docs"
        focus: "Document the pipeline architecture, module relationships, and data flow"
        report: "12-docs-architecture.md"

  template: |
    {# ── Reusable macros ────────────────────────────────────── #}
    {% macro ctx() %}
    Project directory: {{ project }} (source code lives here)
    Workspace: {{ workspace }} (score artifacts/reports only)
    Package: {{ project }}/viral_clip_extractor/ (Python package)
    Tests: {{ project }}/tests/ (root level, NOT inside the package)
    Reports: {{ workspace }}/score-artifacts/ (create if missing)
    Design doc: {{ design_doc }}
    Test fixtures: {{ test_video_dir }} (shared across stages)

    IMPORTANT: Run all code commands from {{ project }}, NOT {{ workspace }}.
    Write reports to {{ workspace }}/score-artifacts/.
    {% endmacro %}

    {% macro output_spec(filename) %}
    ## Output
    - **File**: {{ workspace }}/score-artifacts/{{ filename }}
    - **Format**: Markdown with clear section headers
    - Write a complete, well-structured document
    {% endmacro %}

    {% macro quality_bar(level) %}
    {% if level == "high" %}
    Quality: Be thorough. Cite specific file paths and line numbers.
    No hedging. If uncertain, state what you'd need to verify.
    {% elif level == "draft" %}
    Quality: Prioritize coverage over polish. Mark uncertainties with [?].
    {% endif %}
    {% endmacro %}

    {% macro failure_rule() %}
    CRITICAL DESIGN PRINCIPLE: Every feature is mandatory. There are NO
    optional features, NO --no-* flags, NO silent fallbacks. If semantic
    analysis fails, the clip fails. If caption generation fails, the clip
    fails. If subtitle generation fails, the clip fails. If transcript
    segmentation fails, the pipeline fails. Failure = error, not degraded
    output. The user HATES silent fallbacks.
    {% endmacro %}

    {% macro pipeline_rule() %}
    PIPELINE ARCHITECTURE: The pipeline is transcript-first. The flow is:
    1. Whisper full-video transcription (word-level timestamps)
    2. LLM segmentation (send transcript to Ollama, get clip boundaries)
    3. Snap boundaries to speech pauses
    4. Analyze segments (audio + visual + semantic)
    5. Score virality
    6. Rank + filter + select
    7. Extract clips (always vertical 9:16, face-aware crop)
    8. Burn subtitles (reuse Whisper words from step 1)
    9. Generate captions (Ollama — hook, description, hashtags)
    10. Write CSV (filename → full_caption mapping)

    PySceneDetect is NOT the primary segmenter. Ollama LLM analysis of
    the transcript text determines clip boundaries. Speech content drives
    segmentation, not visual transitions.
    {% endmacro %}

    {# ── Stage logic ────────────────────────────────────────── #}
    {% if stage == 1 %}
    # Stage 1: Frame

    {{ ctx() }}

    ## Context
    Read the design doc at {{ design_doc }}.

    This project (Viral Clip Extractor) takes long-form YouTube video and
    produces ready-to-post short-form clips for TikTok/Instagram Reels/
    YouTube Shorts. It replaces paid services like OpusClip.

    The hardening score completed: 224 tests pass, 80% coverage. But the
    tool has critical issues:
    1. No burned-in subtitles (clips unusable without post-processing)
    2. Scene-based segmentation produces arbitrary boundaries
    3. Optional feature flags allow disabling core functionality
    4. Silent fallbacks hide real failures
    5. Smart cropper produces off-center crops
    6. No documentation

    This score will one-shot the rest of development. Five parallel workers
    will implement changes, each with its own preprocessing/thinking step.

    {{ failure_rule() }}
    {{ pipeline_rule() }}

    ## The Five Workers
    1. **Foundation** ({{ workers[1].files }}) — data models, config, deps, cleanup
    2. **Transcript Segmenter** — new module for LLM-driven segmentation
    3. **Subtitle Burner** — new module for TikTok word-pop subtitles
    4. **Pipeline & Cropper** ({{ workers[4].files }}) — pipeline inversion + smart cropper fix
    5. **Hardening & CLI** ({{ workers[5].files }}) — remove fallbacks + flags

    ## Your Task
    Frame the implementation precisely:

    1. **Restate ALL changes** — one section per worker
    2. **Map every file** that needs to change (read the design doc)
    3. **Define success criteria** per worker:
       - W1: PipelineConfig has no toggles, has whisper_model, transcript_bridge gone
       - W2: transcript_segmenter.py exists with full_transcribe + segment_by_content + refine_boundaries
       - W3: subtitle_burner.py exists with generate_ass + burn_subtitles + process_clip
       - W4: pipeline.py is transcript-first, smart_cropper uses visual-focus center
       - W5: No _default_features, no None returns, no --no-* flags, --whisper-model exists
    4. **Define integration criteria** (cross-worker):
       - Pipeline imports and uses TranscriptSegmenter and SubtitleBurner
       - CSV maps clip filename to full_caption
       - All tests pass
       - Live extraction produces subtitled clips
    5. **Identify risks** — what could go wrong?

    {{ output_spec("01-framing.md") }}
    {{ quality_bar("draft") }}

    {% elif stage == 2 %}
    # Preprocessing: {{ workers[instance].name }} (Worker {{ instance }})

    {{ ctx() }}
    {{ failure_rule() }}
    {{ pipeline_rule() }}

    Read the framing at {{ workspace }}/score-artifacts/01-framing.md.

    You are the thinking step for **Worker {{ instance }}: {{ workers[instance].name }}**.
    Your job is to read all relevant files, gather context, and produce a
    detailed manifest so the execution worker can focus on implementation.

    {% if instance == 1 %}
    ## Worker 1 Scope: Foundation
    Files to modify: models.py, utils/config.py, bootstrap.py
    Files to remove: transcript_bridge.py

    ### Read every file in scope
    ```bash
    cd {{ project }}
    cat viral_clip_extractor/models.py
    cat viral_clip_extractor/utils/config.py
    cat viral_clip_extractor/bootstrap.py
    cat viral_clip_extractor/transcript_bridge.py
    ```

    ### Find ALL references to toggle fields and transcript_bridge
    ```bash
    cd {{ project }}
    grep -rn "enable_semantic\|enable_captions\|vertical_crop" viral_clip_extractor/ tests/ --include="*.py"
    grep -rn "TranscriptBridge\|transcript_bridge" viral_clip_extractor/ tests/ --include="*.py"
    grep -rn "OPTIONAL_DEPS\|PYTHON_DEPS\|faster_whisper" viral_clip_extractor/bootstrap.py
    ```

    ### Document exactly what needs to change
    For each file, list:
    - Current state (key fields, methods, imports)
    - What to remove (specific lines)
    - What to add (new fields, new values)

    {% elif instance == 2 %}
    ## Worker 2 Scope: Transcript Segmenter
    New file: transcript_segmenter.py

    ### Study existing patterns
    ```bash
    cd {{ project }}
    # See how audio_analyzer uses faster-whisper for trigger words
    cat viral_clip_extractor/core/audio_analyzer.py
    # See how semantic_analyzer calls Ollama
    cat viral_clip_extractor/core/semantic_analyzer.py
    # See existing models for SceneSegment
    cat viral_clip_extractor/models.py
    ```

    ### Verify faster-whisper word-level API
    ```bash
    cd {{ project }} && python -c "
    from faster_whisper import WhisperModel
    model = WhisperModel('tiny', device='cpu', compute_type='int8')
    import os
    fixture = '{{ test_video_dir }}/rickroll_30s.mp4'
    if os.path.exists(fixture):
        segments, info = model.transcribe(fixture, word_timestamps=True)
        for seg in segments:
            if seg.words:
                for w in seg.words[:10]:
                    print(f'  word=\"{w.word}\" start={w.start:.3f} end={w.end:.3f}')
                break
        print(f'Language: {info.language}, prob: {info.language_probability:.2f}')
    else:
        print(f'MISSING FIXTURE: {fixture}')
    "
    ```

    ### Verify Ollama API for segmentation
    ```bash
    curl -s http://localhost:11434/api/tags | python3 -c "
    import json, sys
    data = json.load(sys.stdin)
    models = [m['name'] for m in data.get('models', [])]
    print('Available models:', models)
    if 'qwen2.5-vl:7b' in models:
        print('OK: qwen2.5-vl:7b is available')
    else:
        print('WARNING: qwen2.5-vl:7b not found')
    "
    ```

    ### Design the module
    Document:
    - Class structure (TranscriptSegmenter)
    - Data classes (WordTimestamp, SegmentBoundary)
    - Method signatures and contracts
    - The LLM segmentation prompt (draft it)
    - How boundary refinement works (speech pause snapping)
    - Error handling (what raises, when)

    {% elif instance == 3 %}
    ## Worker 3 Scope: Subtitle Burner
    New file: subtitle_burner.py

    ### Study dependencies
    ```bash
    # Verify FFmpeg libass support
    ffmpeg -filters 2>/dev/null | grep -i "ass\|subtitles"

    # Check available fonts
    fc-list | grep -i "arial\|dejavu" | head -5
    ```

    ### Research ASS format
    Study the ASS (Advanced SubStation Alpha) format:
    - Script Info section (PlayResX, PlayResY)
    - V4+ Styles (font, size, colors, positioning)
    - Events (Dialogue lines with timing)

    ### Design the module
    - Class structure (SubtitleBurner)
    - How word-pop grouping works (1-3 words at a time)
    - ASS timing format (h:mm:ss.cc)
    - Platform-safe positioning calculations:
      - Frame: 1080x1920 (9:16)
      - Text at 62% from top = MarginV of ~730px from bottom
      - 15% side margins = ~162px each side
      - Font size: 5.5% of height = ~106px
    - FFmpeg command for hardburn: `ffmpeg -i clip.mp4 -vf "ass=temp.ass" -c:a copy out.mp4`
    - How time-shifting works (clip words relative to clip start)
    - Error handling (empty words = error, FFmpeg failure = error)

    ### Read the models the worker will need
    ```bash
    cd {{ project }}
    cat viral_clip_extractor/models.py
    ```

    {% elif instance == 4 %}
    ## Worker 4 Scope: Pipeline & Smart Cropper
    Files to modify: pipeline.py, core/scene_detector.py, extractors/smart_cropper.py

    ### Read every file in scope
    ```bash
    cd {{ project }}
    cat viral_clip_extractor/pipeline.py
    cat viral_clip_extractor/core/scene_detector.py
    cat viral_clip_extractor/extractors/smart_cropper.py
    ```

    ### Trace the current pipeline flow
    Map every step in `process_video()`:
    - What methods are called, in what order
    - Where are the conditional paths (enable_semantic, enable_captions)
    - Where does scene_detector get called
    - Where do clips get extracted
    - Where do captions get generated

    ### Plan the new flow
    Document the exact new flow:
    1. Validate video + metadata
    2. `segmenter.segment_video()` → segments + words
    3. `_analyze_segment()` for each (always with semantic)
    4. Score + rank + filter + select
    5. Extract clips (always vertical)
    6. Burn subtitles (using words from step 2)
    7. Generate captions (always, raise on failure)
    8. Write CSV

    ### Study smart_cropper fallback
    - What happens when no face is detected?
    - What's the current fallback logic?
    - How should visual-focus detection work?

    {% elif instance == 5 %}
    ## Worker 5 Scope: Hardening & CLI
    Files to modify: core/semantic_analyzer.py, caption_generator.py,
    extractors/clip_extractor.py, cli.py

    ### Read every file in scope
    ```bash
    cd {{ project }}
    cat viral_clip_extractor/core/semantic_analyzer.py
    cat viral_clip_extractor/caption_generator.py
    cat viral_clip_extractor/extractors/clip_extractor.py
    cat viral_clip_extractor/cli.py
    ```

    ### Find ALL fallback paths
    ```bash
    cd {{ project }}
    grep -rn "_default_features\|return None\|return self._default" viral_clip_extractor/core/semantic_analyzer.py
    grep -rn "return None" viral_clip_extractor/caption_generator.py
    grep -rn "vertical\|self\.vertical" viral_clip_extractor/extractors/clip_extractor.py
    grep -rn "no.semantic\|no.captions\|no.vertical\|no_semantic\|no_captions\|no_vertical" viral_clip_extractor/cli.py
    ```

    ### Capture current CLI help
    ```bash
    cd {{ project }}
    python -m viral_clip_extractor --help 2>&1
    python -m viral_clip_extractor process --help 2>&1
    python -m viral_clip_extractor check --help 2>&1
    ```

    ### Document every change needed
    For each file, list every line that needs to change and what the
    replacement should be. Be surgical — line numbers, current code,
    new code.
    {% endif %}

    ### Run current test suite (all preprocessors)
    ```bash
    cd {{ project }} && python -m pytest tests/ -q --tb=short 2>&1
    ```

    ### Verify test fixtures (all preprocessors)
    ```bash
    ls -la {{ test_video_dir }}/*.mp4 2>/dev/null || echo "MISSING FIXTURES"
    ```
    If rickroll_30s.mp4 is missing, download and create it:
    ```bash
    mkdir -p {{ test_video_dir }}
    cd {{ project }} && python -c "
    from viral_clip_extractor.youtube_downloader import YouTubeDownloader
    dl = YouTubeDownloader(output_dir='{{ test_video_dir }}')
    result = dl.download('{{ rickroll_url }}')
    print(f'Downloaded: {result[\"video_path\"]}')
