    path: "{workspace}/score-artifacts/08-tdf-synthesis.md"
    condition: "stage == 8"
    stage: 1
  - type: content_regex
    path: "{workspace}/score-artifacts/08-tdf-synthesis.md"
    pattern: "(?si)Issue count:\\s*\\d+"
    condition: "stage == 8"
    stage: 2
    description: "Synthesis has issue count"

  # === Stage 9: Remediation 2 (fan-out x6) ===
  - type: file_exists
    path: "{workspace}/score-artifacts/09-remediation2-{instance}.md"
    condition: "stage == 9"
    stage: 1
  - type: command_succeeds
    command: 'cd /home/emzi/Projects/yacg && python -m pytest tests/ -x --tb=line --override-ini="addopts="'
    condition: "stage == 9"
    stage: 2
    description: "Tests pass after remediation 2"

  # === Stage 10: Live E2E ===
  - type: file_exists
    path: "{workspace}/score-artifacts/10-live-e2e.md"
    condition: "stage == 10"
    stage: 1
  - type: content_regex
    path: "{workspace}/score-artifacts/10-live-e2e.md"
    pattern: "(?si)LIVE E2E:\\s*(ALL PASS|FAILURES FOUND)"
    condition: "stage == 10"
    stage: 2
    description: "E2E has verdict"

  # === Stage 11: Final Remediation ===
  - type: file_exists
    path: "{workspace}/score-artifacts/11-final-remediation.md"
    condition: "stage == 11"
    stage: 1
  - type: command_succeeds
    command: 'cd /home/emzi/Projects/yacg && python -m pytest tests/ -x --tb=line --override-ini="addopts="'
    condition: "stage == 11"
    stage: 2
    description: "Tests pass after final remediation"

  # === Stage 12: Docs Research ===
  - type: command_succeeds
    command: 'test -f "{workspace}/score-artifacts/12-docs-research.md"'
    condition: "stage == 12 and instance == 1"
    stage: 1
    description: "Framework research report exists"
  - type: command_succeeds
    command: 'test -f "{workspace}/score-artifacts/12-docs-audit.md"'
    condition: "stage == 12 and instance == 2"
    stage: 1
    description: "Codebase audit report exists"
  - type: command_succeeds
    command: 'test -f "{workspace}/score-artifacts/12-docs-architecture.md"'
    condition: "stage == 12 and instance == 3"
    stage: 1
    description: "Architecture docs report exists"

  # === Stage 13: Docs Write ===
  - type: command_succeeds
    command: 'test -f /home/emzi/Projects/yacg/mkdocs.yml'
    condition: "stage == 13"
    stage: 1
    description: "mkdocs.yml exists"
  - type: command_succeeds
    command: 'test -f /home/emzi/Projects/yacg/docs/index.md'
    condition: "stage == 13"
    stage: 1
    description: "docs/index.md exists"
  - type: command_succeeds
    command: 'cd /home/emzi/Projects/yacg && python -m mkdocs build --strict 2>&1 | tail -1 | grep -qi "built\|documentation built"'
    condition: "stage == 13"
    stage: 2
    description: "MkDocs builds successfully"
  - type: file_exists
    path: "{workspace}/score-artifacts/13-docs-write.md"
    condition: "stage == 13"
    stage: 2

  # === Stage 14: Docs Review ===
  - type: file_exists
    path: "{workspace}/score-artifacts/14-docs-review.md"
    condition: "stage == 14"
    stage: 1
  - type: content_regex
    path: "{workspace}/score-artifacts/14-docs-review.md"
    pattern: "(?si)FINAL VERDICT:\\s*(PASS|ISSUES REMAIN)"
    condition: "stage == 14"
    stage: 2
    description: "Final verdict present"
