    ## Worker 3: Subtitle Burner

    Create `{{ project }}/viral_clip_extractor/subtitle_burner.py`.

    Use your preprocessing report for ASS format research and positioning calculations.

    ### Class: SubtitleBurner
    ```python
    class SubtitleBurner:
        def generate_ass(self, words: list[WordTimestamp],
                         frame_width: int, frame_height: int) -> str:
            """Generate ASS subtitle content with TikTok word-pop styling.
            Words are pre-sliced and time-shifted for this clip.
            Groups 1-3 words at a time for display.
            RAISES if words is empty."""

        def burn_subtitles(self, clip_path: str, ass_content: str) -> str:
            """Write ASS to temp file, run FFmpeg hardburn.
            Returns path to subtitled clip.
            RAISES on FFmpeg failure."""

        def process_clip(self, clip_path: str, words: list[WordTimestamp],
                         frame_width: int, frame_height: int) -> str:
            """Full pipeline: generate ASS → burn.
            RAISES on failure. No un-subtitled clips."""
    ```

    ### TikTok Word-Pop ASS Styling
    - Font: Arial Bold (or DejaVu Sans Bold)
    - Font size: 5.5% of frame height (e.g., 106px on 1920h)
    - Primary color: white (`&H00FFFFFF`)
    - Outline color: black (`&H00000000`), width 3px
    - Shadow: 1.5px
    - Position: centered, 62% from top (use Alignment 2 = bottom-center
      with MarginV = frame_height * 0.38)
    - Side margins: 15% each side

    ### Word Grouping Algorithm
    Group words into display chunks of 1-3 words:
    - Start a new group every 1-3 words
    - If a word ends a sentence (period, question mark, exclamation),
      end the group there
    - Each group's timing: from first word's start to last word's end

    ### Time Shifting
    The words come from the full-video transcription. For a clip starting
    at `clip_start`, subtract `clip_start` from each word's start/end time.

    ### ASS Format
    ```
    [Script Info]
    ScriptType: v4.00+
    PlayResX: {width}
    PlayResY: {height}

    [V4+ Styles]
    Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
    Style: WordPop,Arial,{fontsize},&H00FFFFFF,&H000000FF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,3,1.5,2,{marginL},{marginR},{marginV},1

    [Events]
    Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
    Dialogue: 0,{start},{end},WordPop,,0,0,0,,{text}
    ```

