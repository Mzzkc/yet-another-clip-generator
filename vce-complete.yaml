    {% if instance == 1 %}
    ## Worker 1: Foundation

    ### Part A: Update models.py
    1. Remove from `PipelineConfig`: `enable_semantic`, `enable_captions`, `vertical_crop`
    2. Add to `PipelineConfig`: `whisper_model: str = "base"`
    3. Add to `ClipData`: `subtitle_path: Optional[str] = None`

    ### Part B: Update utils/config.py
