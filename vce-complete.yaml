    FULL=$(ls {{ test_video_dir }}/*.mp4 | grep -v synthetic | grep -v 30s | head -1)
    ffmpeg -y -i "$FULL" -t 30 -c copy {{ test_video_dir }}/rickroll_30s.mp4
    ```

    {{ output_spec(workers[instance].preprocess_report) }}
    {{ quality_bar("high") }}

    {% elif stage == 3 %}
    # Execute: {{ workers[instance].name }} (Worker {{ instance }})

    {{ ctx() }}
    {{ failure_rule() }}
    {{ pipeline_rule() }}

    Read YOUR preprocessing report at {{ workspace }}/score-artifacts/{{ workers[instance].preprocess_report }}.
