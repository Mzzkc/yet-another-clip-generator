    {% elif instance == 2 %}
    ## Worker 2: Transcript Segmenter

    Create `{{ project }}/viral_clip_extractor/transcript_segmenter.py`.

    Use your preprocessing report for the API research and prompt design.

    ### Data Classes
    ```python
    @dataclass
    class WordTimestamp:
        word: str
        start: float  # seconds
        end: float    # seconds

    @dataclass
    class SegmentBoundary:
        start_time: float
        end_time: float
        hook_summary: str
        segment_type: str  # "hook", "narrative", "highlight", etc.
    ```

    ### Class: TranscriptSegmenter
    ```python
    class TranscriptSegmenter:
        def __init__(self, whisper_model="base", ollama_host="http://localhost:11434",
                     model_name="qwen2.5-vl:7b"):
            ...

        def full_transcribe(self, video_path: str) -> list[WordTimestamp]:
            """Run faster-whisper on the FULL video with word_timestamps=True.
            RAISES on failure or empty transcription."""

        def segment_by_content(self, words: list[WordTimestamp],
                               title: str) -> list[SegmentBoundary]:
            """Send transcript to Ollama for LLM segmentation.
            RAISES on Ollama failure. No fallback."""

        def refine_boundaries(self, segments: list[SegmentBoundary],
                              words: list[WordTimestamp]) -> list[SceneSegment]:
            """Snap boundaries to speech pauses (>300ms gaps).
            Validate: no overlaps, within bounds, min/max duration.
            Returns SceneSegment objects for pipeline compatibility."""

        def segment_video(self, video_path: str,
                          title: str) -> tuple[list[SceneSegment], list[WordTimestamp]]:
            """High-level entry point: transcribe → segment → refine.
            Returns (segments, all_words)."""
    ```

    ### LLM Segmentation Prompt
    The prompt should:
    - Include the full transcript with timestamps: `[00:00.0-00:03.2] word word word`
    - Ask for 15-45s segments with complete thoughts, hooks, narrative arcs
    - Request JSON output: `[{"start_time": 0.0, "end_time": 32.5, "hook_summary": "...", "segment_type": "hook"}, ...]`
    - Be clear about what makes a viral clip (strong hook, complete thought, natural boundaries)

    ### Boundary Refinement
    - For each segment boundary, find the nearest gap >300ms between words
    - Snap the boundary to that gap (so clips don't cut mid-word)
    - Validate no overlaps between segments
    - Enforce min_scene_len and max_scene_len from PipelineConfig

