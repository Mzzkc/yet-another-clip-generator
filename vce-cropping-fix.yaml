    # Stage 7: Implement Detection Cascade

    {{ ctx() }}
    {{ crop_rule() }}

    This stage only runs if the empirical benchmark (Stage 5) concluded PROCEED.
    Read the cascade TDD tests at {{ workspace }}/score-artifacts/06-tdd-cascade.md
    and the empirical results at {{ workspace }}/score-artifacts/05-empirical.md.

    ## Your Task
    Make ALL cascade tests pass. Implement the person detection cascade.

    ### Changes to `{{ project }}/viral_clip_extractor/extractors/smart_cropper.py`:

    1. **New: `_detect_person_center_x_from_frame(self, frame) -> Optional[int]`**
       - Load MobileNet-SSD model via `cv2.dnn.readNetFromCaffe()`
       - Use prototxt and caffemodel from `~/.vce/models/`
       - Create blob: `cv2.dnn.blobFromImage(frame, 0.007843, (300, 300), 127.5)`
       - Run forward pass, look for class 15 (person) with confidence > 0.3
       - Return center X of the largest person bbox, or None
       - Cache the model (load once)
       - Log detection results

    2. **New: `_saliency_center_x_from_frame(self, frame) -> Optional[int]`**
       - Implement spectral residual saliency using pure NumPy FFT
       - Convert frame to grayscale, resize to manageable size
       - FFT → log amplitude → smooth → spectral residual → IFFT → saliency map
       - Find the peak saliency region, return its center X
       - ~20 lines of NumPy, no new dependencies
       - Return None if saliency is ambiguous (peak near center already)

    3. **New: `_ensure_model_files(self) -> bool`**
       - Check if `~/.vce/models/MobileNetSSD_deploy.prototxt` and
         `~/.vce/models/MobileNetSSD_deploy.caffemodel` exist
       - If not, attempt download from known URLs
       - Return True if files available, False if not
       - Log clearly on failure (never silent)

    4. **Refactor `get_crop_params()`:**
       - Replace the face detection loop with the cascade:
         For each sample frame:
           a) Try `_detect_person_center_x_from_frame(frame)` → if result, use it
           b) Try `_saliency_center_x_from_frame(frame)` → if result, use it
           c) Neither? → no center for this frame (will fall to center crop)
       - Still collect centers, still use median, still validate spatial consistency
       - Log which detector produced each center
       - Haar/face detection is NOT used in this path anymore

    5. **Keep `_detect_face_center_x_from_frame()` for backward compat**
       but it should NOT be called from `get_crop_params()`.

