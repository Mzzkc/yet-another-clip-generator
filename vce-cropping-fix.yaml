    {% elif stage == 5 %}
    # Stage 5: Empirical Benchmark

    {{ ctx() }}

    ## Context
    The integration report recommends MobileNet-SSD person detection (COCO/VOC person class)
    as the primary detector for vertical cropping. But NO ONE has tested whether it actually
    detects a person wearing a fursuit. This stage tests that empirically.

    ## Your Task

    ### 1. Download MobileNet-SSD model files
    Download the Caffe MobileNet-SSD model (trained on PASCAL VOC, which includes "person"
    as class index 15) to `{{ model_dir }}/`:

    ```bash
    mkdir -p {{ model_dir }}

    # MobileNet-SSD deploy prototxt
    wget -q -O {{ model_dir }}/MobileNetSSD_deploy.prototxt \
      "https://raw.githubusercontent.com/chuanqi305/MobileNet-SSD/master/deploy.prototxt" 2>&1

    # MobileNet-SSD caffemodel (~23MB)
    # Try the chuanqi305 repo first, then alternative sources
    wget -q -O {{ model_dir }}/MobileNetSSD_deploy.caffemodel \
      "https://raw.githubusercontent.com/chuanqi305/MobileNet-SSD/master/mobilenet_iter_73000.caffemodel" 2>&1

    ls -la {{ model_dir }}/
    ```

    If download fails, try alternative sources (search for "MobileNetSSD_deploy.caffemodel download"
    or use the TensorFlow model zoo converted weights). The model must work with `cv2.dnn.readNetFromCaffe()`.

    ### 2. Write and run benchmark script
    Create a Python script at `{{ workspace }}/benchmark_person_detection.py` that:

    a) Opens the test video: `{{ test_video }}`
    b) Extracts 20 frames evenly spaced across the video
    c) For each frame, runs MobileNet-SSD person detection:
       - Load model with `cv2.dnn.readNetFromCaffe(prototxt, caffemodel)`
       - Create blob: `cv2.dnn.blobFromImage(frame, 0.007843, (300, 300), 127.5)`
       - Run forward pass
       - Check detections for class 15 (person) with confidence > 0.3
       - Record: frame index, detected (yes/no), confidence, bbox
    d) Also runs Haar cascade face detection on each frame for comparison
    e) Reports:
       - Person detection rate: X/20 frames
       - Haar face detection rate: X/20 frames (for comparison — expect high false positives)
       - Average person detection confidence
       - Bbox positions (where does it think the person is?)

    ```bash
    cd {{ project }} && python {{ workspace }}/benchmark_person_detection.py 2>&1
    ```

    ### 3. Go/No-Go Decision
    Based on the benchmark results:
    - If MobileNet-SSD detects a person in > 60% of frames (12+/20): **PROCEED**
      Person detection works on fursuits. Phase 3 (cascade implementation) should proceed.
    - If detection rate is ≤ 60%: **ABORT**
      Person detection fails on fursuits. Skip Phase 3. The validation layer from Phase 1
      combined with center crop is the final architecture.

    Write the decision clearly in the report.

    {{ output_spec("05-empirical.md") }}
