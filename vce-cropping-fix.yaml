    Read the preprocessing report at {{ workspace }}/score-artifacts/02-preprocessing.md.

    ## Your Task
    Write tests FIRST (TDD). These tests define the validation behavior we need.
    Implementation comes in Stage 4. The new tests MUST FAIL now (no implementation yet).
    Existing tests MUST still PASS.

    ### Tests to Write
    Add these test functions to `{{ project }}/tests/test_visual_analyzer.py`:

    **Face validation tests (in a new TestFaceValidation class):**

    1. `test_reject_face_too_small` — A face bbox covering < 3% of frame area must be rejected.
       Test with a 1920x1080 frame and a 30x30 bbox (0.14% area).

    2. `test_reject_face_too_large` — A face bbox covering > 70% of frame area must be rejected.
       Test with a 1920x1080 frame and a 1500x1000 bbox (72% area).

    3. `test_reject_face_bad_aspect_ratio` — A bbox with width/height > 2:1 must be rejected.
       Test with a 300x100 bbox (3:1 ratio).

    4. `test_accept_face_plausible` — A reasonable face (200x250, ~2.4% of 1920x1080) must be accepted.

    5. `test_reject_inconsistent_face_positions` — If face center X positions across frames
       spread > 30% of frame width, reject them. Test with centers at [100, 960, 1800] on
       a 1920-wide frame (spread = 1700, which is 88% of frame width → reject).

    6. `test_accept_consistent_face_positions` — Centers at [900, 950, 920] on 1920-wide
       frame (spread = 50, which is 2.6% → accept).

    **Exception handling tests:**

    7. `test_dnn_exception_logs_warning` — When DNN detection throws an exception, it must
       log a warning (not silently pass). Mock the DNN net to raise RuntimeError, verify
       logger.warning is called.

    8. `test_detection_logging_shows_detector` — When a face is detected, the log must
