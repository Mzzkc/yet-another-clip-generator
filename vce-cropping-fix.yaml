    {% elif stage == 8 %}
    # Adversarial Review: {{ reviewers[instance].name | title }}

    {{ ctx() }}
    {{ crop_rule() }}

    ## CRITICAL: Do Not Trust Prior Reports
    Previous stages may claim success while leaving real issues. Your job is to find
    problems by RUNNING CODE, not by reading reports.

    ## KNOWN GAP FROM STAGE 4
    `validate_spatial_consistency()` was imported in smart_cropper.py but NEVER CALLED
    in `get_crop_params()`. It must be called on `face_centers` BEFORE the median
    computation (between collecting centers and `if face_centers:`). This is the check
    that rejects scattered false positives across frames. FIX THIS if it's still missing.

    ## Your Review Focus
    {{ reviewers[instance].focus }}

    **Note:** If `{{ workspace }}/score-artifacts/07-cascade-impl.md` does NOT exist,
    Phase 3 (person detection cascade) was skipped because the empirical benchmark
    found MobileNet-SSD does not reliably detect fursuits. The validation layer
    (Phase 1) is the sole fix in that case. Review accordingly.

    Read all prior artifacts:
    - {{ workspace }}/score-artifacts/01-framing.md
    - {{ workspace }}/score-artifacts/02-preprocessing.md
    - {{ workspace }}/score-artifacts/04-validation-impl.md
    - {{ workspace }}/score-artifacts/05-empirical.md (check PROCEED vs ABORT)

    Read the actual source code:
    - `{{ project }}/viral_clip_extractor/core/visual_analyzer.py`
    - `{{ project }}/viral_clip_extractor/extractors/smart_cropper.py`
    - `{{ project }}/tests/test_visual_analyzer.py`

    {% if instance == 1 %}
    ## Regression Review

    Your focus: ensure NOTHING was broken by the changes.

    1. Run the FULL test suite (not just visual analyzer tests):
       ```bash
       cd {{ project }} && python -m pytest tests/ -v --tb=short 2>&1
       ```

    2. Verify talking-head detection still works:
       - Create a test with a mock face at a plausible position (center of frame,
         reasonable size). Verify `get_crop_params()` still produces a face-aware crop.
       - The validation layer should ACCEPT legitimate faces, not just reject everything.

    3. Verify pipeline integration:
       ```bash
       cd {{ project }} && python -c "
       from viral_clip_extractor.extractors.smart_cropper import SmartCropper
       from viral_clip_extractor.models import PipelineConfig
       sc = SmartCropper(PipelineConfig())
       print('SmartCropper instantiates OK')
       print('Methods:', [m for m in dir(sc) if not m.startswith('_')])
       " 2>&1
       ```

    4. If any test fails, FIX IT. Don't just report.

    {% elif instance == 2 %}
    ## Correctness Review

    Your focus: verify the validation layer actually catches false positives.

    1. Run the test suite:
       ```bash
       cd {{ project }} && python -m pytest tests/test_visual_analyzer.py -v --tb=short 2>&1
       ```

    2. Verify validation thresholds are correct:
       - Is 3% area minimum reasonable? (A face at 1920x1080 should be at least ~60x60)
       - Is 70% area maximum reasonable? (A face shouldn't cover most of the frame)
       - Is 2:1 aspect ratio limit reasonable? (Real faces are roughly 1:1.3)
       - Is 30% spatial spread threshold reasonable? (Genuine face should be consistent)

    3. Run VCE on the test video in quick mode:
       ```bash
       cd {{ project }} && python -m viral_clip_extractor process \
         --video "{{ test_video }}" \
         --title "Correctness Review" \
         --output-dir /tmp/vce_correctness_review \
         --whisper-model tiny --top-n 2 --min-score 0 2>&1
       ```
       Check the logs: are validation messages present? Did any detections get rejected?

    4. Clean up:
       ```bash
       rm -rf /tmp/vce_correctness_review
       ```

    5. If thresholds are wrong or validation doesn't work, FIX IT.

    {% elif instance == 3 %}
    ## Robustness Review

    Your focus: try to break the system with edge cases.

    1. Run the test suite:
       ```bash
       cd {{ project }} && python -m pytest tests/ -v --tb=short 2>&1
       ```

    2. Test edge cases:
       - What happens with an all-black frame? Does detection fail gracefully?
       - What happens if the model files are missing? (Remove them temporarily)
       - What happens with a corrupt/empty video file?
       - What happens if cv2.dnn throws an unexpected error?
       - Are all OpenCV resources (VideoCapture) properly released?

    3. Write tests for any edge cases that aren't covered:
       Add to `{{ project }}/tests/test_visual_analyzer.py`.

    4. Verify resource cleanup:
       ```bash
       cd {{ project }} && python -c "
       import gc
       from viral_clip_extractor.extractors.smart_cropper import SmartCropper
       from viral_clip_extractor.models import PipelineConfig
       sc = SmartCropper(PipelineConfig())
       params = sc.get_crop_params('/nonexistent/video.mp4')
       print('Nonexistent video params:', params)
       gc.collect()
       print('No resource leaks')
       " 2>&1
       ```

    5. Fix anything broken. Don't just report.
    {% endif %}

    ## Produce
    - **Problems Found**: Specific issues with evidence (file paths, line numbers, error output)
    - **Fixes Applied**: What you repaired (include diffs or descriptions)
    - **Remaining Concerns**: What worries you
    - **Issue count: N (P1: X, P2: Y, P3: Z)**
      - P1: Must fix (blocks release)
      - P2: Should fix (quality issue)
      - P3: Nice to fix (polish)

    {{ output_spec("08-review-" ~ instance ~ ".md") }}

    {% elif stage == 9 %}
    # Stage 9: Remediation

    {{ ctx() }}
    {{ crop_rule() }}

    Read all 3 review reports:
    {% for i in range(1, 4) %}
    - {{ workspace }}/score-artifacts/08-review-{{ i }}.md ({{ reviewers[i].name }})
    {% endfor %}

    ## Your Task
    Fix every P1 and P2 issue found by the reviewers.

    1. Read each review report carefully
    2. For each P1 issue: fix it immediately
    3. For each P2 issue: fix it
    4. For P3 issues: fix if straightforward, skip if complex
    5. Run the full test suite after all fixes:
       ```bash
       cd {{ project }} && python -m pytest tests/ -v --tb=short 2>&1
       ```
    6. If any test fails after your fixes, fix the test or the code (never skip a test)

    {{ output_spec("09-remediation.md") }}
    Document: each issue addressed, what was fixed, final test results.

    {% elif stage == 10 %}
    # Stage 10: Live E2E Verification

    {{ ctx() }}
    {{ crop_rule() }}

    ## Your Task
    Full end-to-end verification on real video and full test suite.

    ### 1. Full extraction on test video
    Run VCE with normal settings (not quick mode) on the furry ASMR video:
    ```bash
    cd {{ project }} && python -m viral_clip_extractor process \
      --video "{{ test_video }}" \
      --title "Cropping Fix E2E" \
      --output-dir /tmp/vce_cropping_e2e \
      --top-n 3 --min-score 0 2>&1
    ```

    ### 2. Inspect the output
    - Check logs for validation messages (detections accepted/rejected)
    - Check logs for detector identification (which detector used per frame)
    - Check crop parameters: are any clips still cropping to the far right (x > 1500)?
    - If clips were produced, check their crop_x values

    ### 3. Run full test suite with coverage
    ```bash
    cd {{ project }} && python -m pytest tests/ -v --tb=short \
      --cov=viral_clip_extractor \
      --cov-report=term-missing \
      --cov-branch 2>&1
    ```

    ### 4. Cleanup
    ```bash
    rm -rf /tmp/vce_cropping_e2e
    ```

    ### 5. Verdict
    Based on the E2E results and test suite:
    - If ALL tests pass AND no clips have obviously bad cropping (x > 1500 on a
      1920-wide video when subject is centered): **LIVE E2E: ALL PASS**
    - If ANY test fails OR cropping is still bad: **LIVE E2E: FAILURES FOUND**
      followed by a list of failures

    {{ output_spec("10-live-e2e.md") }}
    {{ quality_bar("high") }}

    The report MUST contain:
    - **E2E Output** (command output, clip info)
    - **Log Analysis** (validation messages, detector decisions)
    - **Crop Parameter Check** (crop_x values for each clip)
    - **Test Suite Results** (pass/fail counts, coverage)
    - **Verdict: LIVE E2E: ALL PASS** or **Verdict: LIVE E2E: FAILURES FOUND**

    {% elif stage == 11 %}
    # Stage 11: Final Fix

    {{ ctx() }}
    {{ crop_rule() }}

    This stage only runs if Stage 10 found failures.
    Read {{ workspace }}/score-artifacts/10-live-e2e.md for the failure details.

    ## Your Task
    Fix whatever Stage 10 found broken.

    1. Read the E2E report to understand what failed
