# vce-cropping-fix.yaml
#
# Pattern: TDD Implementation Pipeline (11 stages, 13 sheets)
# Goal: Fix false-positive face detection on furry ASMR content.
#       Haar cascade detects fur textures as faces → bad crop to x=1191.
#       Three-phase fix: (1) validation layer, (2) empirical benchmark,
#       (3) person detection cascade. Uses TDD throughout.
#
# Execution Flow:
#   Stage 1:  Frame — success criteria, file map                    (1 sheet)
#   Stage 2:  Preprocess — read code, run baseline, verify state    (1 sheet)
#   Stage 3:  TDD: Write Validation Tests — tests first for Phase 1 (1 sheet)
#   Stage 4:  Implement Validation Layer — make tests pass          (1 sheet)
#   Stage 5:  Empirical Benchmark — MobileNet-SSD on fursuit frames (1 sheet)
#   Stage 6:  TDD: Write Cascade Tests — tests first for Phase 3    (1 sheet, CONDITIONAL)
#   Stage 7:  Implement Detection Cascade — make tests pass         (1 sheet, CONDITIONAL)
#   Stage 8:  Adversarial Review — 3 parallel lenses                (3 sheets, fan-out x3)
#   Stage 9:  Remediation — fix review findings                     (1 sheet)
#   Stage 10: Live E2E — real video + full pytest                   (1 sheet)
#   Stage 11: Final Fix — conditional, skip if E2E clean            (1 sheet)
#
# Skip Conditions:
#   Stages 6-7: Skip if empirical benchmark ABORTs (detection rate < 60%)
#   Stage 11: Skip if live E2E passes clean

name: "vce-cropping-fix"
workspace: "/home/emzi/Projects/yacg/workspaces/vce-cropping-workspace"

backend:
  type: claude_cli
  skip_permissions: true
  disable_mcp: true
  timeout_seconds: 2400
  output_format: text
  timeout_overrides:
    2: 3600    # Preprocess: reads many files, runs tests
    4: 3600    # Implementation: significant code changes
    5: 5400    # Empirical: model download + video processing
    7: 3600    # Cascade implementation
    8: 3600    # Reviewers: run full suite + real video
    9: 3600    # Remediation: fix review findings + retest
    10: 5400   # E2E: real video processing

sheet:
  size: 1
  total_items: 11
  fan_out:
    8: 3    # 3 adversarial reviewers
  dependencies:
    2: [1]
    3: [2]
    4: [3]
    5: [4]
    6: [5]
    7: [6]
    8: [7]
    9: [8]
    10: [9]
    11: [10]
  skip_when_command:
    6:
      command: 'grep -q "ABORT" "{workspace}/score-artifacts/05-empirical.md"'
      description: "Skip cascade TDD tests if empirical benchmark ABORTed"
      timeout_seconds: 10
    7:
      command: 'grep -q "ABORT" "{workspace}/score-artifacts/05-empirical.md"'
      description: "Skip cascade implementation if empirical benchmark ABORTed"
      timeout_seconds: 10
    11:
      command: 'grep -q "LIVE E2E: ALL PASS" "{workspace}/score-artifacts/10-live-e2e.md"'
      description: "Skip final fix if live E2E passed clean"
      timeout_seconds: 10

parallel:
  enabled: true
  max_concurrent: 3

cross_sheet:
  auto_capture_stdout: true
  max_output_chars: 10000
  lookback_sheets: 8
  capture_files:
    - "{{ workspace }}/score-artifacts/02-preprocessing.md"
    - "{{ workspace }}/score-artifacts/05-empirical.md"

retry:
  max_retries: 2
  base_delay_seconds: 15
  max_completion_attempts: 3
  completion_threshold_percent: 100

rate_limit:
  wait_minutes: 60
  max_waits: 12

stale_detection:
  enabled: true
  idle_timeout_seconds: 2400

prompt:
  variables:
    project: "/home/emzi/Projects/yacg"
    test_video: "/mnt/c/Users/mckys/Videos/test_clips/downloads/-Zds0V0kg94.mp4"
    model_dir: "~/.vce/models"
    integration_report: "/home/emzi/Projects/yacg/coordination-workspace/integration-report.md"

    reviewers:
      1:
        name: "regression"
        focus: "Do ALL existing tests still pass? Did we break talking-head detection? Pipeline still works?"
      2:
        name: "correctness"
        focus: "Does validation catch false positives? Cascade work on real video? Thresholds correct?"
      3:
        name: "robustness"
        focus: "Edge cases: corrupt video, model files missing, all-black frame, resource cleanup."

  template: |
    {# ── Reusable macros ────────────────────────────────────── #}
    {% macro ctx() %}
    Project directory: {{ project }} (source code lives here)
    Workspace: {{ workspace }} (score artifacts/reports only)
    Package: {{ project }}/viral_clip_extractor/ (Python modules)
    Tests: {{ project }}/tests/ (root level, NOT inside the package)
    Reports: {{ workspace }}/score-artifacts/ (create if missing)
    Integration report: {{ integration_report }} (TDF research findings)
    Test video: {{ test_video }} (furry ASMR video that triggered the bug)

    IMPORTANT: Run all code commands from {{ project }}, NOT {{ workspace }}.
    Write reports to {{ workspace }}/score-artifacts/.
    {% endmacro %}

    {% macro output_spec(filename) %}
    ## Output
    - **File**: {{ workspace }}/score-artifacts/{{ filename }}
    - **Format**: Markdown with clear section headers
    - Write a complete, well-structured document
    {% endmacro %}

    {% macro quality_bar(level) %}
    {% if level == "high" %}
    Quality: Be thorough. Cite specific file paths and line numbers.
    No hedging. If uncertain, state what you'd need to verify.
    {% elif level == "draft" %}
    Quality: Prioritize coverage over polish. Mark uncertainties with [?].
    {% endif %}
    {% endmacro %}

    {% macro crop_rule() %}
    CRITICAL CROPPING RULE: Vertical crop must be face-aware or center-focused — NEVER arbitrary offset.
    Detection cascade: person detection → saliency → center crop.
    Silent fallbacks are FORBIDDEN — log every detection decision with which detector was used,
    what was detected, and why it was accepted or rejected.
    If detection confidence is low, center crop IS the correct answer (not a failure).
    The existing `except Exception: pass` patterns MUST be replaced with logged warnings.
    {% endmacro %}

    {# ── Stage logic ────────────────────────────────────────── #}
    {% if stage == 1 %}
    # Stage 1: Frame the Cropping Fix

    {{ ctx() }}

    ## Context
    Running VCE on a furry ASMR video produced 6 clips where 4/6 cropped to x=1191
    (far right of frame) due to Haar cascade false-positive "face" detections on fur
    textures. A TDF research team (4 specialists + integration PM) identified the root
    cause and a 3-phase fix. This score implements the fix using TDD.

    ## Your Task
    Read these files and produce a framing document:

    1. Read the integration report at {{ integration_report }}
    2. Read `{{ project }}/viral_clip_extractor/extractors/smart_cropper.py`
    3. Read `{{ project }}/viral_clip_extractor/core/visual_analyzer.py`
    4. Read `{{ project }}/viral_clip_extractor/extractors/clip_extractor.py`
    5. Read `{{ project }}/tests/test_visual_analyzer.py`

    Then produce:

    ### Success Criteria
    Define what "done" looks like:
    - Phase 1: Validation layer catches implausible face detections (too small, too large,
      bad aspect ratio, spatially inconsistent across frames)
    - Phase 2: Empirical benchmark determines if MobileNet-SSD person detection works on fursuits
    - Phase 3 (conditional): Detection cascade replaces Haar in crop path (person → saliency → center)
    - All existing tests still pass (no regressions)
    - No bare `except Exception: pass` remains in visual_analyzer.py
    - Every detection decision is logged (detector used, accepted/rejected, reason)

    ### File Change Map
    Map every file that will be modified across all 3 phases, with specific changes per file.

    ### Risk Assessment
    What could go wrong? What are the wolf patterns to watch for?

    {{ crop_rule() }}
    {{ output_spec("01-framing.md") }}
