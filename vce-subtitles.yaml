    ```bash
    cd {{ project }}
    STALE=$(grep -rn "enable_semantic\|enable_captions\|vertical_crop\|no.semantic\|no.captions\|no.vertical\|no_semantic\|no_captions\|no_vertical" viral_clip_extractor/ tests/ --include="*.py" | grep -v "\.pyc" | grep -v "__pycache__")
    if [ -n "$STALE" ]; then
      echo "STALE FLAGS FOUND:"
      echo "$STALE"
    else
      echo "CLEAN: no stale flags"
    fi
    ```

    ## Part 5: Full test suite with coverage
    ```bash
    cd {{ project }} && python -m pytest tests/ -v --tb=short \
      --cov=viral_clip_extractor \
      --cov-report=term-missing \
      --cov-branch 2>&1
    ```

