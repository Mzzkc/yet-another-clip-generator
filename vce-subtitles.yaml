    {% elif instance == 3 %}
    ## Worker 3: CLI + Pipeline Wiring

    Use the preprocessing manifest to find every flag reference.

    ### cli.py
    1. Remove argparse arguments: `--no-semantic`, `--no-captions`, `--no-vertical`
    2. Add argparse argument: `--whisper-model` (choices: tiny, base, small, medium, large-v3; default: base)
    3. Update `_build_config()` to remove references to removed flags
    4. Update `_build_config()` to pass `whisper_model` to PipelineConfig
    5. Remove any warning about `--no-semantic` usage
    6. Remove `no_semantic`, `no_captions`, `no_vertical` from namespace handling
    7. Update the `check` subcommand: `faster_whisper` is now required, not optional

    ### pipeline.py
    1. Remove ALL conditional checks for `self.config.enable_semantic`,
       `self.config.enable_captions`, `self.config.vertical_crop`
    2. Semantic analysis, caption generation, and vertical crop are ALWAYS ON
    3. Add subtitle burn step after clip extraction, before caption generation:
       ```python
       # After extracting clips, burn subtitles
       subtitle_burner = self._get_subtitle_burner()
       for clip in clips:
           subtitled_path = subtitle_burner.process_clip(
               clip.output_path,
               frame_width=...,  # from clip metadata
               frame_height=...
           )
           clip.output_path = subtitled_path  # Replace with subtitled version
       ```
    4. Add `_get_subtitle_burner()` lazy initializer following existing pattern
    5. Update pipeline step numbering in log messages
    6. When semantic analysis raises, catch at segment level, add to errors
    7. When caption generation raises, catch at clip level, add to errors
    8. When subtitle burn raises, catch at clip level, add to errors
    9. A clip with any error is NOT included in the output

    After all changes, verify:
