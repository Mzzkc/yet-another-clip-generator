    cd {{ project }}
    python -m viral_clip_extractor --help 2>&1 | grep -c "no-semantic\|no-captions\|no-vertical"
    # Should output 0

    python -m viral_clip_extractor process --help 2>&1 | grep "whisper-model"
    # Should show the new flag

    python -m viral_clip_extractor check 2>&1
    ```

