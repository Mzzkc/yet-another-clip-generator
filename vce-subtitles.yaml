    python -m viral_clip_extractor process \
      --video {{ test_video_dir }}/rickroll_30s.mp4 \
      --title "E2E Subtitle Test" \
      --output-dir /tmp/vce_e2e_subtitles \
      --top-n 3 --min-score 0 \
      --whisper-model tiny 2>&1
    ```

    ## Part 3: Verify subtitles are burned in
    ```bash
    # Check each clip has subtitle content
    for clip in /tmp/vce_e2e_subtitles/clip_*.mp4; do
      echo "=== Checking: $clip ==="
      # Extract a frame and check for text overlay (file size difference)
      DURATION=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 "$clip")
      echo "  Duration: $DURATION"
      SIZE=$(stat -f%z "$clip" 2>/dev/null || stat -c%s "$clip")
      echo "  Size: $SIZE bytes"
    done

    # Check CSV report
    cat /tmp/vce_e2e_subtitles/clips_report.csv
    ```

