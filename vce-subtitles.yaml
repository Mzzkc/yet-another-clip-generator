# vce-subtitles.yaml
#
# Pattern: Tier 5 Complex Implementation (11 stages, 21 sheets)
# Goal: Add TikTok word-pop burned-in subtitles + remove optional feature
#       flags + harden all failure paths. No silent fallbacks.
#
# Execution Flow:
#   Stage 1:  Frame — success criteria, change manifest
#   Stage 2:  Preprocess — read all files, grep refs, verify deps
#   Stage 3:  Execute — 3 parallel workers implement changes (fan-out x3)
#   Stage 4:  Test Rewrite — update test suite for new behavior
#   Stage 5:  Adversarial Review 1 — 3 lenses verify (fan-out x3)
#   Stage 6:  Remediation 1 — fix review 1 issues (fan-out x3)
#   Stage 7:  TDF Review — 5 persona lenses deep-review (fan-out x5)
#   Stage 8:  TDF Synthesis — collide perspectives, priority queue
#   Stage 9:  Remediation 2 — optional, skip if synthesis found 0 issues
#   Stage 10: Live E2E — run the actual tool on real video + pytest
#   Stage 11: Final Remediation — optional, skip if E2E clean

name: "vce-subtitles"
workspace: "/home/emzi/Projects/yacg/workspaces/vce-subtitles-workspace"

backend:
  type: claude_cli
  skip_permissions: true
  disable_mcp: true
  timeout_seconds: 2400
  output_format: text
  timeout_overrides:
    2: 3600     # Preprocess: reads many files, runs dep checks
    3: 3600     # Execute workers: significant code changes
    4: 3600     # Test rewrite: many files to update
    9: 3600     # Remediation 2: may need substantial fixes
    10: 5400    # Live E2E: downloads video, processes, verifies
    11: 3600    # Final remediation

sheet:
  size: 1
  total_items: 11
  fan_out:
    3: 3    # 3 execution workers
    5: 3    # 3 adversarial reviewers
    6: 3    # 3 remediators
    7: 5    # 5 TDF persona reviewers
  dependencies:
    2: [1]
    3: [2]
    4: [3]
    5: [4]
    6: [5]
    7: [6]
    8: [7]
    9: [8]
    10: [9]
    11: [10]
  skip_when_command:
    9:
      command: 'grep -q "Issue count: 0" "{workspace}/score-artifacts/08-tdf-synthesis.md"'
      description: "Skip remediation 2 if TDF synthesis found zero issues"
      timeout_seconds: 10
    11:
      command: 'grep -q "LIVE E2E: ALL PASS" "{workspace}/score-artifacts/10-live-e2e.md"'
      description: "Skip final remediation if live E2E passed clean"
      timeout_seconds: 10

parallel:
  enabled: true
  max_concurrent: 5

cross_sheet:
  auto_capture_stdout: true
  max_output_chars: 10000
  lookback_sheets: 8
  capture_files:
    - "{{ workspace }}/score-artifacts/02-preprocessing.md"
    - "{{ workspace }}/score-artifacts/08-tdf-synthesis.md"

retry:
  max_retries: 2
  base_delay_seconds: 15
  max_completion_attempts: 3
  completion_threshold_percent: 100

rate_limit:
  wait_minutes: 60
  max_waits: 12

stale_detection:
  enabled: true
  idle_timeout_seconds: 3600

prompt:
  variables:
    project: "/home/emzi/Projects/yacg"
    design_doc: "/home/emzi/Projects/yacg/docs/plans/2026-03-05-subtitles-and-hardening-design.md"
    test_video_dir: "/tmp/vce_test_fixtures"
    rickroll_url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"

    workers:
      1:
        name: "foundation-and-subtitles"
        focus: "models.py, config.py, bootstrap.py, new subtitle_burner.py"
        report: "03-exec-foundation.md"
      2:
        name: "core-hardening"
        focus: "semantic_analyzer.py, caption_generator.py, clip_extractor.py — remove all fallbacks"
        report: "03-exec-hardening.md"
      3:
        name: "cli-and-pipeline"
        focus: "cli.py, pipeline.py — remove flags, wire subtitle step, add --whisper-model"
        report: "03-exec-pipeline.md"

    reviewers:
      1:
        name: "completeness"
        focus: "Did every item from the preprocessing manifest get addressed? What was skipped?"
      2:
        name: "correctness"
        focus: "Does the code actually work? Run it. Test it. Verify claims."
      3:
        name: "robustness"
        focus: "Try to break the subtitle system — silent video, edge cases, resource cleanup."

    remediators:
      1:
        name: "completeness-fixes"
        focus: "Address all gaps identified by the completeness reviewer"
      2:
        name: "correctness-fixes"
        focus: "Fix all broken code identified by the correctness reviewer"
      3:
        name: "robustness-fixes"
        focus: "Fix all edge cases and failure modes identified by the robustness reviewer"

    tdf_lenses:
      1:
        name: "youtube-creator"
        voice: >-
          You are a YouTube creator with 500K subscribers who can barely
          use a command line. You know what makes good short-form content
          but you're not technical. You care about: does this tool actually
          produce clips I can post? Are the subtitles readable? Is the
          error output gibberish or helpful? Would I use this over OpusClip?
        focus: "Usability, output quality, subtitle readability, error clarity, competitive value"
        question: "Would I actually use this tool, or would I give up and go back to OpusClip?"
      2:
        name: "ai-builder"
        voice: >-
          You are an AI engineer who builds cool shit and ships fast.
          You care about clean APIs, extensibility, and whether the
          architecture lets you hack on it. You want to fork this and
          add features. You hate over-engineering but love good abstractions.
        focus: "API design, extensibility, code quality, developer experience, hackability"
        question: "Can I fork this and build on it, or is the architecture going to fight me?"
      3:
        name: "graduate-professor"
        voice: >-
          You are a graduate-level computer science professor evaluating
          this as a student project submission. You grade on rigor,
          methodology, correctness, and whether the approach is sound.
          You're not impressed by volume — you want to see clear thinking.
        focus: "Algorithmic correctness, methodology, code structure, documentation quality, rigor"
        question: "Is this well-engineered, or is it duct tape that happens to run?"
      4:
        name: "systems-engineer"
        voice: >-
          You are a systems engineer who happened across this project.
          You think about reliability, resource usage, failure modes,
          deployment, and what happens at 3am when nobody is watching.
          You've been burned by tools that work in demos but break in
          production.
        focus: "Reliability, resource management, failure handling, deployment, monitoring, scalability"
        question: "Will this run reliably on someone else's machine, or only on the developer's?"
      5:
        name: "ml-expert"
        voice: >-
          You are an ML engineer who works with speech models, vision
          models, and multimodal pipelines daily. You know faster-whisper
          internals, Ollama quirks, and where ML pipelines silently
          degrade. You care about model selection, inference quality,
          and whether the ML components are used correctly.
        focus: "Whisper usage, Ollama integration, model selection, inference quality, ML pipeline correctness"
        question: "Are the ML components used correctly, or is this cargo-culting API calls?"

  template: |
    {# ── Reusable macros ────────────────────────────────────── #}
    {% macro ctx() %}
    Project directory: {{ project }} (source code lives here)
    Workspace: {{ workspace }} (score artifacts/reports only)
    Package: {{ project }}/viral_clip_extractor/ (Python package)
    Tests: {{ project }}/tests/ (root level, NOT inside the package)
    Reports: {{ workspace }}/score-artifacts/ (create if missing)
    Design doc: {{ design_doc }}
    Test fixtures: {{ test_video_dir }} (shared across stages)

    IMPORTANT: Run all code commands from {{ project }}, NOT {{ workspace }}.
    Write reports to {{ workspace }}/score-artifacts/.
    {% endmacro %}

    {% macro output_spec(filename) %}
    ## Output
    - **File**: {{ workspace }}/score-artifacts/{{ filename }}
    - **Format**: Markdown with clear section headers
    - Write a complete, well-structured document
    {% endmacro %}

    {% macro quality_bar(level) %}
    {% if level == "high" %}
    Quality: Be thorough. Cite specific file paths and line numbers.
    No hedging. If uncertain, state what you'd need to verify.
    {% elif level == "draft" %}
    Quality: Prioritize coverage over polish. Mark uncertainties with [?].
    {% endif %}
    {% endmacro %}

    {% macro failure_rule() %}
    CRITICAL DESIGN PRINCIPLE: Every feature is mandatory. There are NO
    optional features, NO --no-* flags, NO silent fallbacks. If semantic
    analysis fails, the clip fails. If caption generation fails, the clip
    fails. If subtitle generation fails, the clip fails. Failure = error,
    not degraded output.
    {% endmacro %}

    {# ── Stage logic ────────────────────────────────────────── #}
    {% if stage == 1 %}
    # Stage 1: Frame

    {{ ctx() }}

    ## Context
    Read the design doc at {{ design_doc }}.

    This project (Viral Clip Extractor) takes long-form video and produces
    short-form clips for TikTok/Instagram Reels/YouTube Shorts. It replaces
    paid services like OpusClip.

    The hardening score just completed: 224 tests pass, 80% coverage. But
    the tool is missing a critical feature (burned-in subtitles) and has
    optional feature flags that allow disabling core functionality, hiding
    failures behind silent fallbacks.

    ## Your Task
    Frame the implementation precisely:

    1. **Restate the changes** — what exactly are we building and removing?
    2. **Map every file** that needs to change (read the design doc for the list)
    3. **Define success criteria**:
       - `subtitle_burner.py` exists and works: faster-whisper → ASS → FFmpeg burn-in
       - TikTok word-pop style: 1-3 words, large bold text, platform-safe positioning
       - `--no-semantic`, `--no-captions`, `--no-vertical` flags are GONE
       - `enable_semantic`, `enable_captions`, `vertical_crop` removed from PipelineConfig
       - Semantic analyzer RAISES on failure (no `_default_features()` fallback)
       - Caption generator RAISES on failure (no `None` return)
       - Subtitle burner RAISES on failure (no un-subtitled clips)
       - All tests pass after changes
       - Live extraction produces clips with burned-in subtitles
    4. **Identify risks** — what could go wrong?

    {{ output_spec("01-framing.md") }}
    {{ quality_bar("draft") }}

    {% elif stage == 2 %}
    # Stage 2: Preprocessing

    {{ ctx() }}
    {{ failure_rule() }}

    Read the framing at {{ workspace }}/score-artifacts/01-framing.md.

    ## Your Task
    Gather ALL raw material so downstream workers can focus on implementation.

    ### 1. Read every file that will be modified
    Read and summarize the current state of:
    ```bash
    cd {{ project }}
    cat viral_clip_extractor/models.py
    cat viral_clip_extractor/pipeline.py
    cat viral_clip_extractor/cli.py
    cat viral_clip_extractor/core/semantic_analyzer.py
    cat viral_clip_extractor/caption_generator.py
    cat viral_clip_extractor/extractors/clip_extractor.py
    cat viral_clip_extractor/utils/config.py
    cat viral_clip_extractor/bootstrap.py
    ```

    ### 2. Find EVERY reference to removed flags
    ```bash
    cd {{ project }}
    grep -rn "enable_semantic\|enable_captions\|vertical_crop" viral_clip_extractor/ tests/ --include="*.py"
    grep -rn "no.semantic\|no.captions\|no.vertical\|no_semantic\|no_captions\|no_vertical" viral_clip_extractor/ tests/ --include="*.py"
    ```
    Record every hit with file:line. This is the surgical manifest.

    ### 3. Verify faster-whisper word-level API
    ```bash
    cd {{ project }} && python -c "
    from faster_whisper import WhisperModel
    model = WhisperModel('tiny', device='cpu', compute_type='int8')
    # Transcribe a test fixture with word timestamps
    import os
    fixture = '{{ test_video_dir }}/rickroll_30s.mp4'
    if os.path.exists(fixture):
        segments, info = model.transcribe(fixture, word_timestamps=True)
        for seg in segments:
            if seg.words:
                for w in seg.words[:5]:
                    print(f'  word=\"{w.word}\" start={w.start:.2f} end={w.end:.2f}')
                break
        print(f'Language: {info.language}, prob: {info.language_probability:.2f}')
    else:
        print(f'MISSING FIXTURE: {fixture}')
    "
    ```

    ### 4. Verify FFmpeg libass/subtitles support
    ```bash
    ffmpeg -filters 2>/dev/null | grep -i "ass\|subtitles"
    ```

    ### 5. Verify test fixtures exist
    ```bash
    ls -la {{ test_video_dir }}/*.mp4 2>/dev/null
    ```
    If rickroll_30s.mp4 is missing, download and create it:
    ```bash
    mkdir -p {{ test_video_dir }}
    cd {{ project }} && python -c "
    from viral_clip_extractor.youtube_downloader import YouTubeDownloader
    dl = YouTubeDownloader(output_dir='{{ test_video_dir }}')
    result = dl.download('{{ rickroll_url }}')
    print(f'Downloaded: {result[\"video_path\"]}')
    "
    FULL=$(ls {{ test_video_dir }}/*.mp4 | grep -v synthetic | grep -v 30s | head -1)
    ffmpeg -y -i "$FULL" -t 30 -c copy {{ test_video_dir }}/rickroll_30s.mp4
    ```

    ### 6. Run current test suite
    ```bash
    cd {{ project }} && python -m pytest tests/ -q --tb=short 2>&1
    ```

    ### 7. Capture current CLI help
    ```bash
    cd {{ project }}
    python -m viral_clip_extractor --help 2>&1
    python -m viral_clip_extractor process --help 2>&1
    ```

    ## Write the preprocessing report

    {{ output_spec("02-preprocessing.md") }}
    {{ quality_bar("high") }}

    The report MUST have these sections:
    - **File Summaries** (current state of each file being modified)
    - **Flag Reference Manifest** (every grep hit — file:line:content)
    - **faster-whisper Verification** (word-level timestamps work? output?)
    - **FFmpeg Subtitle Support** (ass/subtitles filters available?)
    - **Test Fixtures** (paths to all available fixtures)
    - **Current Test State** (pass/fail counts)
    - **Current CLI** (help output showing flags to be removed)

    {% elif stage == 3 %}
    # Execute: {{ workers[instance].name }}

    {{ ctx() }}
    {{ failure_rule() }}

    Read the preprocessing report at {{ workspace }}/score-artifacts/02-preprocessing.md.
    Use the flag reference manifest to find every line that needs to change.
    Read the design doc at {{ design_doc }}.

    {% if instance == 1 %}
    ## Worker 1: Foundation + Subtitle Module

    ### Part A: Update models.py
    1. Remove from `PipelineConfig`: `enable_semantic`, `enable_captions`, `vertical_crop`
    2. Add to `PipelineConfig`: `whisper_model: str = "base"`
    3. Add to `ClipData`: `subtitle_path: Optional[str] = None`

    ### Part B: Update utils/config.py
    Remove INI reads for the three removed fields. Remove them from
    `save_default_config` if present.

    ### Part C: Update bootstrap.py
    Move `faster_whisper` from `OPTIONAL_DEPS` to `PYTHON_DEPS` (required).

    ### Part D: Create subtitle_burner.py
    New file at `{{ project }}/viral_clip_extractor/subtitle_burner.py`.

    Architecture:
    - Class `SubtitleBurner` with lazy-loaded WhisperModel
    - `transcribe(clip_path) → list[WordTimestamp]`: faster-whisper with
      `word_timestamps=True`. Returns word-level timing data. RAISES on
      failure or empty transcription (silent clip = error).
    - `generate_ass(words, frame_width, frame_height) → str`: Generate ASS
      subtitle file content with TikTok word-pop styling.
    - `burn_subtitles(clip_path, ass_content) → str`: FFmpeg hardburn via
      `ffmpeg -i clip.mp4 -vf "ass=temp.ass" -c:a copy out.mp4`. RAISES
      on FFmpeg failure. Returns path to subtitled clip.
    - `process_clip(clip_path, frame_width, frame_height) → str`: Full
      pipeline: transcribe → generate ASS → burn. Single public entry point.

    **TikTok Word-Pop ASS Styling:**
    - Font: Arial or DejaVu Sans Bold (check availability)
    - Font size: ~5.5% of frame height (e.g., 106px on 1920h)
    - Position: centered horizontally, anchored at 62% from top
    - Margins: 15% left and right (clears platform UI buttons)
    - Style: white fill, black outline (3px), drop shadow
    - Display: 1-3 words at a time, timed to speech

    **ASS format reference:**
    ```
    [Script Info]
    ScriptType: v4.00+
    PlayResX: {width}
    PlayResY: {height}

    [V4+ Styles]
    Format: Name, Fontname, Fontsize, PrimaryColour, ...
    Style: WordPop,Arial,{fontsize},&H00FFFFFF,&H000000FF,...

    [Events]
    Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
    Dialogue: 0,{start},{end},WordPop,,{marginL},{marginR},{marginV},,{words}
    ```

    After creating, verify:
    ```bash
    cd {{ project }}
    python -c "from viral_clip_extractor.subtitle_burner import SubtitleBurner; print('Import OK')"
    python -c "
    from viral_clip_extractor.models import PipelineConfig
    assert not hasattr(PipelineConfig, 'enable_semantic'), 'enable_semantic still exists!'
    assert not hasattr(PipelineConfig, 'enable_captions'), 'enable_captions still exists!'
    assert not hasattr(PipelineConfig, 'vertical_crop'), 'vertical_crop still exists!'
    assert hasattr(PipelineConfig, 'whisper_model'), 'whisper_model missing!'
    print('PipelineConfig OK')
    "
    ```

    {{ output_spec(workers[instance].report) }}

    {% elif instance == 2 %}
    ## Worker 2: Core Hardening

    Use the preprocessing manifest to find every fallback path.

    ### semantic_analyzer.py
    1. Delete `_default_features()` method entirely
    2. In `_query_with_retries()`: when all retries exhausted, RAISE
       `RuntimeError("Semantic analysis failed after N retries")` instead
       of returning `_default_features()`
    3. Remove any other call to `_default_features()` — each must raise
    4. Update docstrings to reflect that methods raise on failure

    ### caption_generator.py
    1. `analyze_video()` must RAISE on failure, not return `None`
    2. Remove all `return None` failure paths — replace with raises
    3. The return type changes from `Optional[CaptionData]` to `CaptionData`
    4. Update docstrings

    ### clip_extractor.py
    1. Remove the `vertical` parameter from `__init__` — always vertical
    2. `_get_vertical_filter()` must RAISE on failure, not return `None`
    3. Remove any conditional that checks `self.vertical` — always crop
    4. Remove the `if config is None else config.vertical_crop` logic
    5. The SmartCropper import failure becomes a hard error

    After all changes, verify:
    ```bash
    cd {{ project }}
    python -c "
    from viral_clip_extractor.core.semantic_analyzer import SemanticAnalyzer
    # Verify _default_features is gone
    assert not hasattr(SemanticAnalyzer, '_default_features'), '_default_features still exists!'
    print('SemanticAnalyzer hardened')
    "
    python -c "
    from viral_clip_extractor.caption_generator import OllamaVideoAnalyzer
    import inspect
    sig = inspect.signature(OllamaVideoAnalyzer.analyze_video)
    ret = sig.return_annotation
    print(f'analyze_video return type: {ret}')
    "
    python -c "
    from viral_clip_extractor.extractors.clip_extractor import ClipExtractor
    import inspect
    sig = inspect.signature(ClipExtractor.__init__)
    assert 'vertical' not in sig.parameters, 'vertical param still in ClipExtractor.__init__!'
    print('ClipExtractor hardened')
    "
    ```

