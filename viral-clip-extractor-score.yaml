    from viral_clip_extractor.cli import main
    main()
    ```

    ### Task 6: Integration Tests (`{{ workspace }}/tests/test_pipeline.py`)

    - Test PipelineConfig loading from INI
    - Test CLI argument parsing for all subcommands (process, youtube, batch, check)
    - Test TranscriptBridge with mock transcript JSON
    - Test YouTubeDownloader URL parsing
    - Test pipeline initialization with default config
    - Test _generate_csv produces correct columns
    - Mock-based test: mock all analyzers, verify pipeline calls them in order

    ### CRITICAL: Integration Verification

    After writing everything, run these and FIX any errors:
    ```bash
    PYTHONPATH={{ workspace }} python -c "from viral_clip_extractor.pipeline import ViralClipPipeline; print('Pipeline OK')"
    PYTHONPATH={{ workspace }} python -c "from viral_clip_extractor.cli import main; print('CLI OK')"
    PYTHONPATH={{ workspace }} python -c "from viral_clip_extractor.transcript_bridge import TranscriptBridge; print('Bridge OK')"
    PYTHONPATH={{ workspace }} python -c "from viral_clip_extractor.youtube_downloader import YouTubeDownloader; print('YouTube OK')"
    PYTHONPATH={{ workspace }} python -m pytest {{ workspace }}/tests/test_pipeline.py -v 2>&1 | tail -20
    ```

    If imports fail, READ the error traceback, fix the issue, and re-test. Common problems:
    - Circular imports (reorganize)
    - Module-to-module type mismatches (they were built by independent agents)
    - Missing methods that pipeline.py expects but a module doesn't have

    {{ code_quality() }}

    Print: complete system summary, all import results, test results.

    {% elif stage == 4 %}
    ## Stage 4: End-to-End Verification + Helper Scripts + Documentation

    **Goal: Make sure everything actually works, create user-facing scripts, fix any remaining bugs.**

    ### Context — Read Everything
    Read ALL Python files in `{{ workspace }}/viral_clip_extractor/` and `{{ workspace }}/tests/`.
    Also read:
    - `{{ workspace }}/helper.py` — existing helper script (follow this UX pattern)
    - `{{ workspace }}/test_system.py` — existing system test (follow this pattern)

    ### Task 1: Comprehensive Import & Integration Verification

    Run ALL of these. For EACH failure, read the traceback, fix the root cause, re-test:
    ```bash
    PYTHONPATH={{ workspace }} python -c "
    from viral_clip_extractor.models import SceneSegment, AudioFeatures, VisualFeatures, SemanticFeatures, ViralityScore, ClipData, PipelineConfig, ProcessingResult
    print('Models: ALL OK')
    "
    PYTHONPATH={{ workspace }} python -c "
    from viral_clip_extractor.core.scene_detector import SceneDetector
    from viral_clip_extractor.core.audio_analyzer import AudioAnalyzer
    from viral_clip_extractor.core.visual_analyzer import VisualAnalyzer
    from viral_clip_extractor.core.semantic_analyzer import SemanticAnalyzer
    from viral_clip_extractor.core.virality_scorer import ViralityScorer
    print('Core modules: ALL OK')
    "
    PYTHONPATH={{ workspace }} python -c "
    from viral_clip_extractor.extractors.clip_extractor import ClipExtractor
    from viral_clip_extractor.extractors.smart_cropper import SmartCropper
    print('Extractors: ALL OK')
    "
    PYTHONPATH={{ workspace }} python -c "
    from viral_clip_extractor.pipeline import ViralClipPipeline
    from viral_clip_extractor.cli import main
    from viral_clip_extractor.youtube_downloader import YouTubeDownloader
    print('Pipeline + CLI + YouTube: ALL OK')
    "
    ```

    Also verify NO `NotImplementedError` remains in any implementation file:
    ```bash
    grep -rn "NotImplementedError" {{ workspace }}/viral_clip_extractor/ --include="*.py" || echo "No stubs found — good"
    ```
    If any NotImplementedError found in non-placeholder code, implement the missing methods.

    ### Task 2: Run ALL Tests

    ```bash
    PYTHONPATH={{ workspace }} python -m pytest {{ workspace }}/tests/ -v 2>&1
    ```
    Fix any failures. If tests reference imports that don't exist, fix the test OR the module.

    ### Task 3: System Verification Script (`{{ workspace }}/test_clip_system.py`)

    Follow pattern from `{{ workspace }}/test_system.py`. Checks:
    1. Python version >= 3.10
    2. FFmpeg available
    3. FFprobe available
    4. scenedetect installed + importable
    5. librosa installed + importable
    6. opencv (cv2) installed + importable
    7. numpy installed
    8. requests installed
    9. yt-dlp installed
    10. Ollama service running (http://localhost:11434)
    11. Qwen2.5-VL model available
    12. Output directory writable
    13. Disk space > 2GB free
    14. yt-transcriber available at {{ yt_transcriber_root }} (optional)
    15. faster-whisper available (optional)

    Print PASS/FAIL for each with fix suggestions for failures.

    ### Task 4: Helper Menu Script (`{{ workspace }}/clip_helper.py`)

    Follow `{{ workspace }}/helper.py` UX pattern. Menu:
    1. Process a local video file (prompt for path, title)
    2. Process a YouTube video (prompt for URL)
    3. Batch process video directory (prompt for directory)
    4. Run system verification
    5. View/edit configuration
    6. View recent results (list clips from output dir, show CSV)
    7. Quick test (process first 5 minutes of a video)
    8. Exit

    User-friendly input prompts, validation, progress display.

    ### Task 5: Consistency Review

    Read all module files and fix:
    - Import consistency (all use `from viral_clip_extractor.models import ...`)
    - Logging consistency (same format/pattern)
    - No bare `except:` (always catch specific exceptions)
    - All public methods have docstrings
    - Type hints on all signatures
    - No hardcoded paths

    ### Task 6: README (`{{ workspace }}/CLIP_EXTRACTOR_README.md`)

    Sections (ALL required):
    - **Overview**: What this system does (2-3 sentences)
    - **Prerequisites**: Python 3.10+, FFmpeg, Ollama with Qwen2.5-VL, system requirements
    - **Installation**: pip install from requirements + Ollama setup
    - **Quick Start**: 3 commands to process your first video
    - **CLI Reference**: All subcommands (process, youtube, batch, check) with examples
    - **Configuration**: config.ini sections explained, how to tune scoring weights
    - **Architecture**: Module diagram showing pipeline flow
    - **CSV Output**: Column descriptions, how to use with staging tools
    - **Troubleshooting**: Common issues and fixes

    {{ code_quality() }}

    ### Final Report
    Print:
    - All files created or modified (with what was fixed)
    - Import verification results (all must pass)
    - Test results
    - NotImplementedError scan results
    - What works out of the box vs what needs Ollama/GPU
    - Quick start instructions for the user

    {% endif %}

