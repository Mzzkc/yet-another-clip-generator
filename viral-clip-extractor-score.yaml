    {% endif %}

    ### Your Focus: {{ modules[instance].focus }}

    {% if instance == 1 %}
    **Implement `{{ workspace }}/viral_clip_extractor/{{ modules[instance].src_file }}`**

    `SceneDetector` class:
    - `__init__(self, threshold: float = 3.0, min_scene_len: float = 7.0, max_scene_len: float = 60.0)`
    - `detect_scenes(self, video_path: str) -> list[SceneSegment]`
      - Use PySceneDetect with AdaptiveDetector
      - ASMR-optimized: lower thresholds (2.0-4.0) for subtle transitions
      - Merge scenes shorter than min_scene_len with neighbors
      - Split scenes longer than max_scene_len at midpoints
      - Return SceneSegment objects from models.py
    - `_merge_short_scenes(self, scenes: list, min_duration: float) -> list`
    - `_split_long_scenes(self, scenes: list, max_duration: float) -> list`
    - Comprehensive logging of detection results
    - Handle: single-scene videos, very short videos (<7s total), file not found, corrupt files
    - If scenedetect not installed: clear ImportError with install instructions

    {% elif instance == 2 %}
    **Implement `{{ workspace }}/viral_clip_extractor/{{ modules[instance].src_file }}`**

    `AudioAnalyzer` class:
    - `__init__(self, asmr_keywords: Optional[list[str]] = None)`
      Default keywords: ["tingles", "relax", "sleep", "cozy", "gentle", "dragon", "scales", "whisper", "magic"]
    - `analyze_segment(self, video_path: str, start_time: float, end_time: float) -> AudioFeatures`
      - Extract audio from video segment (use video_utils.extract_audio or librosa.load with offset/duration)
      - Compute features:
        - **audio_peak_score**: RMS energy, top 10th percentile loudness
        - **high_freq_score**: spectral centroid > 4kHz fraction (ASMR crisp sounds)
        - **dynamic_range**: std of RMS (interesting vs boring)
        - **zcr_score**: zero crossing rate (whispers, crisp sounds)
        - **overall_energy**: mean RMS
      - ASMR-specific: detect tapping (onset_detect for sharp transients),
        crinkles (high-freq spectral flux), mouth sounds (mid-freq patterns)
    - `_detect_trigger_words(self, audio_path: str, start: float, end: float) -> list[str]`
      - Try faster-whisper for speech-to-text, match against ASMR keyword dictionary
      - Graceful fallback: return empty list if faster-whisper unavailable
      - Reference `{{ yt_transcriber_root }}/transcribe.py` for Whisper patterns
    - Handle: silent segments, corrupt audio, missing audio stream, librosa import failure

    {% elif instance == 3 %}
    **Implement TWO files:**

    **1. `{{ workspace }}/viral_clip_extractor/{{ modules[instance].src_file }}`**

    `VisualAnalyzer` class:
    - `analyze_segment(self, video_path: str, start_time: float, end_time: float) -> VisualFeatures`
      - Sample 1 frame per second (efficient, not every frame)
      - **motion_score**: Farneback optical flow between consecutive frames, mean magnitude
      - **face_presence**: Haar cascade detection, fraction of frames with faces
      - **visual_interest**: color variance in HSV space
      - **composition_score**: rule-of-thirds scoring (subject position relative to thirds lines)
    - `_sample_frames(self, video_path: str, start: float, end: float, fps: int = 1) -> list`
    - Handle: no video stream, corrupt frames, OpenCV import failure

    **2. `{{ workspace }}/viral_clip_extractor/extractors/smart_cropper.py`**

    `SmartCropper` class:
    - `get_crop_params(self, video_path: str, start_time: float = 0, target_ratio: float = 9/16) -> dict`
      Returns dict: crop_x, crop_y, crop_w, crop_h
    - `get_ffmpeg_filter(self, video_path: str, start_time: float = 0, target_ratio: float = 9/16) -> str`
      Returns FFmpeg `-vf` filter string
    - Face-aware: detect face in representative frame, center crop on face
    - Fallback: center crop if no faces detected
    - Handle already-vertical or square video

    {% elif instance == 4 %}
    **Implement `{{ workspace }}/viral_clip_extractor/{{ modules[instance].src_file }}`**

    `SemanticAnalyzer` class (adapt OllamaVideoAnalyzer pattern from caption_generator.py):
    - `__init__(self, model: str = "qwen2.5-vl:7b", ollama_host: str = "http://localhost:11434")`
    - `check_availability(self) -> bool` — check Ollama service + model
    - `analyze_segment(self, video_path: str, start_time: float, end_time: float, title: str = "") -> SemanticFeatures`
      - Extract segment as temp file via video_utils.extract_segment
      - Base64 encode the video segment
      - Send to Qwen2.5-VL with virality-focused prompt asking 0-10 ratings for:
        emotional_intensity, narrative_interest, hook_potential, asmr_quality, visual_appeal, uniqueness
      - Parse JSON response (reuse _parse_llm_response pattern from caption_generator.py)
      - Retry with exponential backoff (max 3 attempts)
    - `_create_virality_prompt(self, duration: float, title: str) -> str`
    - Handle: Ollama not running, model not available, timeout, malformed JSON
    - Return SemanticFeatures with defaults (5.0 for all) on total failure — never crash the pipeline

    {% elif instance == 5 %}
    **Implement TWO files:**

    **1. `{{ workspace }}/viral_clip_extractor/core/virality_scorer.py`**

    `ViralityScorer` class:
    - `__init__(self, weights: Optional[dict] = None)` — use default ASMR weights if None
    - `calculate_score(self, audio: AudioFeatures, visual: VisualFeatures, semantic: Optional[SemanticFeatures], duration: float) -> ViralityScore`
      - Normalize all inputs to 0-10 scale
      - Weighted scoring (design doc): hook 20%, emotional 15%, audio_peaks 15%, asmr 12%,
        motion 12%, narrative 10%, high_freq 10%, uniqueness 8%, visual 7%, duration 5%
      - Duration bonus: 7-30s=10, 5-7s=linear 5-10, 30-60s=linear 10-5, <5s=linear 0-5, >60s=decay
      - If semantic is None: redistribute semantic weights to audio+visual proportionally
      - Return ViralityScore with component breakdown dict
    - `_normalize(self, value: float, min_val: float, max_val: float) -> float`
    - `_duration_score(self, duration: float) -> float`

    **2. `{{ workspace }}/viral_clip_extractor/extractors/clip_extractor.py`**

    `ClipExtractor` class:
    - `__init__(self, vertical: bool = True, context_padding: float = 2.0)`
    - `extract_clip(self, video_path: str, start_time: float, end_time: float, output_path: str) -> bool`
      - Pad boundaries by context_padding seconds (clamp to video bounds)
      - FFmpeg: libx264, CRF 23, AAC 128k
      - Apply SmartCropper filter if vertical=True
      - Validate output exists and is >10KB
    - `batch_extract(self, video_path: str, segments: list[SceneSegment], output_dir: str, scores: Optional[list[float]] = None) -> list[str]`
      - Naming: clip_NN_scoreXX.mp4
    - Handle: FFmpeg not found, disk space, encoding failures

    {% endif %}

