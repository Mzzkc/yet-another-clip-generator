    ## Stage 3: Pipeline Integration + YouTube Support + CLI

    **Priority: End-to-end working pipeline.** A user should be able to run one command and get
    clips + CSV output. Everything must wire together.

    ### Context — Read ALL Module Files
    - `{{ workspace }}/viral_clip_extractor/models.py`
    - `{{ workspace }}/viral_clip_extractor/core/scene_detector.py`
    - `{{ workspace }}/viral_clip_extractor/core/audio_analyzer.py`
    - `{{ workspace }}/viral_clip_extractor/core/visual_analyzer.py`
    - `{{ workspace }}/viral_clip_extractor/core/semantic_analyzer.py`
    - `{{ workspace }}/viral_clip_extractor/core/virality_scorer.py`
    - `{{ workspace }}/viral_clip_extractor/extractors/clip_extractor.py`
    - `{{ workspace }}/viral_clip_extractor/extractors/smart_cropper.py`
    - `{{ workspace }}/viral_clip_extractor/utils/config.py`
    - `{{ workspace }}/viral_clip_extractor/utils/video_utils.py`
    - `{{ workspace }}/viral_clip_extractor/youtube_downloader.py`
    - `{{ workspace }}/caption_generator.py` — for caption integration
    - `{{ yt_transcriber_root }}/transcribe.py` — for transcript bridge patterns

    ### Task 1: Main Pipeline (`{{ workspace }}/viral_clip_extractor/pipeline.py`)

    `ViralClipPipeline` class — the main orchestrator:
    - `__init__(self, config: Optional[PipelineConfig] = None)`
    - `process_video(self, video_path: str, title: str = "", top_n: int = 10, min_score: float = 70.0) -> ProcessingResult`
      Flow:
      1. Validate video exists, extract metadata via video_utils
      2. Detect scenes via SceneDetector
      3. For each scene: analyze audio, visual, semantic (if enabled)
      4. Score each via ViralityScorer
      5. Rank by score, filter by min_score, take top_n
      6. Extract clips via ClipExtractor
      7. Generate captions if enabled (use OllamaVideoAnalyzer from caption_generator.py)
      8. Build and return ProcessingResult
    - `process_youtube(self, url: str, top_n: int = 10, min_score: float = 70.0) -> ProcessingResult`
      - Download video via YouTubeDownloader
      - Extract title from metadata
      - Call process_video on downloaded file
      - Clean up downloaded file after processing (optional, configurable)
    - `_analyze_segment(self, video_path: str, scene: SceneSegment, title: str) -> ClipData`
    - `_generate_csv(self, result: ProcessingResult, output_path: str)`
      CSV columns: clip_filename, start_time, end_time, duration, virality_score,
      hook, description, hashtags, full_caption, category, audio_peak, motion_score,
      face_presence, asmr_quality, processing_timestamp
    - Error recovery: log and skip individual segment failures, never abort the whole pipeline
    - Progress: print "Processing segment X/Y (ZZ%)" at each step
    - Timing: track and report total processing time

    ### Task 2: CLI (`{{ workspace }}/viral_clip_extractor/cli.py`)

    argparse-based CLI with subcommands:

    **`process` subcommand** — process a local video file:
    ```
    python -m viral_clip_extractor process --video /path/to/video.mp4
      --title "My ASMR Video"
      --output-dir ./clip_output
      --top-n 10
      --min-score 70
      --model qwen2.5-vl:7b
      --no-captions
      --no-semantic
      --no-vertical
      --config ./clip_extractor_config.ini
    ```

    **`youtube` subcommand** — process a YouTube video:
    ```
    python -m viral_clip_extractor youtube --url https://www.youtube.com/watch?v=XXXXX
      --output-dir ./clip_output
      --top-n 15
      [same options as process]
    ```

    **`batch` subcommand** — process all videos in a directory:
    ```
    python -m viral_clip_extractor batch --videos-dir /path/to/videos/
      [same options as process]
    ```

    **`check` subcommand** — verify system dependencies

    - `def main()` entry point
    - Also create `{{ workspace }}/viral_clip_extractor/__main__.py` so `python -m viral_clip_extractor` works

    ### Task 3: Transcript Bridge (`{{ workspace }}/viral_clip_extractor/transcript_bridge.py`)

    `TranscriptBridge` class:
    - `__init__(self, yt_transcriber_path: str = "{{ yt_transcriber_root }}")`
