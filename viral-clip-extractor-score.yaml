name: "viral-clip-extractor-build"
workspace: "/home/emzi/Projects/yacg"

backend:
  type: claude_cli
  skip_permissions: true
  disable_mcp: true
  timeout_seconds: 2700
  output_format: json
  allowed_tools: [Read, Write, Edit, Glob, Grep, Bash]

sheet:
  size: 1
  total_items: 4
  fan_out:
    2: 5
  dependencies:
    2: [1]
    3: [2]
    4: [3]

parallel:
  enabled: true
  max_concurrent: 5

stale_detection:
  enabled: true
  idle_timeout_seconds: 1800

retry:
  max_retries: 2
  base_delay_seconds: 15
  max_completion_attempts: 3
  completion_threshold_percent: 70

cross_sheet:
  auto_capture_stdout: true
  max_output_chars: 3000
  lookback_sheets: 8

prompt:
  variables:
    project_root: "/home/emzi/Projects/yacg"
    yt_transcriber_root: "/home/emzi/Projects/yt-transcriber"
    modules:
      1:
        name: "scene_detector"
        focus: "Scene detection and segmentation using PySceneDetect"
        src_file: "core/scene_detector.py"
        test_file: "tests/test_scene_detector.py"
      2:
        name: "audio_analyzer"
        focus: "Audio analysis using librosa for ASMR-specific features"
        src_file: "core/audio_analyzer.py"
        test_file: "tests/test_audio_analyzer.py"
      3:
        name: "visual_analyzer"
        focus: "Visual analysis using OpenCV including smart vertical cropping"
        src_file: "core/visual_analyzer.py"
        test_file: "tests/test_visual_analyzer.py"
      4:
        name: "semantic_analyzer"
        focus: "Semantic content analysis using Qwen2.5-VL via Ollama"
        src_file: "core/semantic_analyzer.py"
        test_file: "tests/test_semantic_analyzer.py"
      5:
        name: "virality_scorer_and_extractor"
        focus: "Virality scoring engine and FFmpeg-based clip extraction"
        src_scorer: "core/virality_scorer.py"
        src_extractor: "extractors/clip_extractor.py"
        test_file: "tests/test_scorer_extractor.py"
  template: |
    {% macro code_quality() %}
    ## Code Quality Requirements
    - Production-grade Python 3.10+ code
    - Type hints on all function signatures
    - Docstrings on all public classes and methods
    - Comprehensive error handling with logging (use logging module)
    - Follow the patterns established in the existing caption_generator.py
    - Use dataclasses for data structures
    - Modular, testable design
    - Import shared models from viral_clip_extractor.models — do NOT redefine data classes
    - NO `raise NotImplementedError` in finished code — every method must have a real implementation
    {% endmacro %}

    {% if stage == 1 %}
    ## Stage 1: Environment Setup + Architecture Foundation

    You are building the **Viral Clip Extractor** — a system that automatically extracts
    viral-potential clips from long-form videos (e.g., 60-minute YouTube ASMR sessions) by
    detecting scene boundaries, analyzing audio/visual/semantic signals, scoring viral potential,
    and extracting formatted clips with auto-generated Instagram captions.

    The system must support BOTH local video files AND YouTube URLs as input.

    ### Part A: Install Dependencies

    Install all required Python packages:
    ```bash
    pip install "scenedetect[opencv]>=0.6" "librosa>=0.10" "opencv-python-headless>=4.8" "numpy>=1.24" "requests>=2.28" "yt-dlp" --break-system-packages
    ```

    Verify each package imports successfully:
    ```bash
    python -c "import scenedetect; print(f'scenedetect {scenedetect.__version__}')"
    python -c "import librosa; print(f'librosa {librosa.__version__}')"
    python -c "import cv2; print(f'opencv {cv2.__version__}')"
    python -c "import numpy; print(f'numpy {numpy.__version__}')"
    python -c "import yt_dlp; print('yt-dlp OK')"
    ```

    Also verify FFmpeg and FFprobe are available:
    ```bash
    ffmpeg -version 2>&1 | head -1
    ffprobe -version 2>&1 | head -1
    ```

    If any package fails to install, note the error and continue — do your best.

    ### Part B: Read Context

    Read these files to understand the existing codebase and design:
    - `{{ workspace }}/caption_generator.py` — existing caption generator to integrate with
    - `{{ workspace }}/config.ini` — existing config format to extend
    - `{{ workspace }}/viral-clip-extractor-design.md` — full system design (READ THOROUGHLY)
    - `{{ workspace }}/viral-clip-roadmap.md` — implementation roadmap
    - `{{ yt_transcriber_root }}/transcribe.py` — YouTube transcriber for Whisper/yt-dlp patterns

    ### Part C: Create Project Structure

    Create all directories and files:
    ```
    {{ workspace }}/viral_clip_extractor/
    ├── __init__.py              (version string, short docstring)
    ├── models.py                (ALL shared data classes — CRITICAL)
    ├── pipeline.py              (placeholder with class skeleton)
    ├── cli.py                   (placeholder with argparse skeleton)
    ├── transcript_bridge.py     (placeholder)
    ├── youtube_downloader.py    (placeholder — YouTube URL support)
    ├── core/
    │   ├── __init__.py
    │   ├── scene_detector.py    (placeholder with interface)
    │   ├── audio_analyzer.py    (placeholder with interface)
    │   ├── visual_analyzer.py   (placeholder with interface)
    │   ├── semantic_analyzer.py (placeholder with interface)
    │   └── virality_scorer.py   (placeholder with interface)
    ├── extractors/
    │   ├── __init__.py
    │   ├── clip_extractor.py    (placeholder with interface)
    │   └── smart_cropper.py     (placeholder with interface)
    └── utils/
        ├── __init__.py
        ├── config.py            (FULL implementation)
        └── video_utils.py       (FULL implementation)
    {{ workspace }}/tests/
    └── __init__.py
    ```

    ### Part D: Shared Data Models (`models.py`) — MOST CRITICAL FILE

    Every module in the system depends on these. Define all dataclasses:

    - **`SceneSegment`**: start_time (float), end_time (float), scene_index (int)
      - Property: `duration -> float` (end_time - start_time)
    - **`AudioFeatures`**: audio_peak_score (float), high_freq_score (float), dynamic_range (float),
      zcr_score (float), trigger_words (list[str] = field(default_factory=list)), overall_energy (float)
    - **`VisualFeatures`**: motion_score (float), face_presence (float), visual_interest (float),
      composition_score (float)
    - **`SemanticFeatures`**: emotional_intensity (float, 0-10), narrative_interest (float, 0-10),
      hook_potential (float, 0-10), asmr_quality (float, 0-10), visual_appeal (float, 0-10),
      uniqueness (float, 0-10), description (str = "")
    - **`ViralityScore`**: total_score (float, 0-100), component_scores (dict[str, float]),
      confidence (float, 0-1)
    - **`ClipData`**: scene (SceneSegment), audio (AudioFeatures), visual (VisualFeatures),
      semantic (Optional[SemanticFeatures] = None), virality (ViralityScore),
      output_path (Optional[str] = None), caption (Optional[dict] = None)
    - **`PipelineConfig`**: All configuration with sensible defaults:
      - model_name: str = "qwen2.5-vl:7b"
      - ollama_host: str = "http://localhost:11434"
      - scene_threshold: float = 3.0
      - min_scene_len: float = 7.0
      - max_scene_len: float = 60.0
      - top_n_clips: int = 10
      - min_virality_score: float = 70.0
      - enable_semantic: bool = True
      - enable_captions: bool = True
      - vertical_crop: bool = True
      - asmr_mode: bool = True
      - output_dir: str = "./clip_output"
      - context_padding: float = 2.0
      - scoring_weights: dict = field(default_factory=lambda: {default ASMR weights from design doc})
    - **`ProcessingResult`**: video_path (str), video_title (str), clips (list[ClipData]),
      total_scenes (int), processing_time_seconds (float), errors (list[str] = field(default_factory=list))

    ### Part E: Implement `utils/config.py`

    - `load_config(path: Optional[str] = None) -> PipelineConfig` — load from INI file with defaults
    - `save_default_config(path: str)` — write default config for first-time setup
    - Use configparser, fall back to PipelineConfig defaults for missing values
    - ASMR weight defaults: hook=0.20, emotional=0.15, audio_peaks=0.15, asmr=0.12,
      motion=0.12, narrative=0.10, high_freq=0.10, uniqueness=0.08, visual=0.07, duration=0.05

    ### Part F: Implement `utils/video_utils.py`

    - `extract_metadata(video_path: str) -> dict` — FFprobe wrapper (adapt from existing VideoProcessor)
    - `extract_audio(video_path: str, output_path: str, start: float = None, end: float = None) -> str`
    - `extract_segment(video_path: str, start: float, end: float, output_path: str) -> str`
    - `get_frame_at_time(video_path: str, time_seconds: float) -> Optional[numpy.ndarray]`
    - Context manager for temp files cleanup

    ### Part G: Implement `youtube_downloader.py`

    `YouTubeDownloader` class (reference `{{ yt_transcriber_root }}/transcribe.py` for yt-dlp patterns):
    - `__init__(self, output_dir: str = "./downloads")`
    - `download(self, url: str) -> dict` — download video via yt-dlp, return dict with:
      - `video_path`: path to downloaded file
      - `title`: video title
      - `duration`: video duration in seconds
      - `channel`: channel name
    - `extract_video_id(self, url: str) -> str` — parse YouTube URL formats
    - Handle: invalid URLs, download failures, network errors
    - Support YouTube URL formats: youtube.com/watch, youtu.be, shorts

    ### Part H: Placeholder Files

    Every placeholder module must contain:
    - Module docstring explaining purpose
    - Import of relevant models from `viral_clip_extractor.models`
    - Class definition with all method signatures (type-hinted, matching design doc)
    - Each method body: `raise NotImplementedError("To be implemented")`

    ### Part I: Create `{{ workspace }}/requirements-clip-extractor.txt`

    ```
    scenedetect[opencv]>=0.6
    librosa>=0.10
    opencv-python-headless>=4.8
    numpy>=1.24
    requests>=2.28
    yt-dlp
    ```

    ### Verification

    After creating everything, run:
    ```bash
    PYTHONPATH={{ workspace }} python -c "from viral_clip_extractor.models import SceneSegment, ClipData, PipelineConfig, ProcessingResult; print('Models OK')"
    PYTHONPATH={{ workspace }} python -c "from viral_clip_extractor.utils.config import load_config; print('Config OK')"
    PYTHONPATH={{ workspace }} python -c "from viral_clip_extractor.utils.video_utils import extract_metadata; print('Video utils OK')"
    PYTHONPATH={{ workspace }} python -c "from viral_clip_extractor.youtube_downloader import YouTubeDownloader; print('YouTube downloader OK')"
    ```

    Fix any import errors before finishing.

    {{ code_quality() }}

    Print a summary of all files created, dependency installation results, and import verification results.

